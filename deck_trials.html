<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英雄牌旅 · The Deckbound Hero</title>
<style>
:root{--gold:#c9a84c;--gold-light:#e8d48a;--red:#e0503a;--green:#5ac878;--blue:#5a8cff;--text:#e7e0d0;--muted:rgba(200,180,140,0.62);--panel:#141024;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#07050f;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:"Noto Serif TC","Songti TC",Georgia,serif;}
#app{position:fixed;inset:0;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.active{display:flex;}
#lang-btn,#music-btn,#home-btn,#fs-btn{position:fixed;top:12px;z-index:1000;background:rgba(0,0,0,.55);border:1px solid var(--gold);color:var(--gold);cursor:pointer;border-radius:3px;font-family:inherit;letter-spacing:1px;text-decoration:none;}
#home-btn{left:12px;padding:6px 12px;font-size:12px;}
#lang-btn{right:12px;padding:6px 12px;font-size:12px;} #music-btn{right:70px;padding:6px 9px;font-size:14px;line-height:1;} #music-btn.muted{opacity:.5;}
#fs-btn{right:108px;padding:6px 9px;font-size:13px;font-weight:700;line-height:1;}
.btn{padding:13px 34px;background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(120,80,200,.2));border:1px solid var(--gold);color:var(--gold-light);font-size:16px;letter-spacing:2px;cursor:pointer;border-radius:3px;font-family:inherit;transition:all .25s;}
.btn:hover{background:linear-gradient(135deg,rgba(201,168,76,.4),rgba(120,80,200,.35));box-shadow:0 0 20px rgba(201,168,76,.3);}
.btn-sm{padding:8px 18px;font-size:13px;letter-spacing:1px;}
.center{align-items:center;justify-content:center;text-align:center;padding:24px;}

/* title */
#title{background:radial-gradient(ellipse at 50% 28%,#221641 0,#0a0820 55%,#06040e 100%);}
.t-zh{font-size:clamp(30px,8vw,46px);color:var(--gold-light);letter-spacing:8px;text-shadow:0 0 24px rgba(201,168,76,.5);}
.t-en{font-size:13px;letter-spacing:5px;color:var(--muted);margin:10px 0 22px;}
.t-sub{font-size:13px;color:var(--muted);line-height:1.9;max-width:520px;margin-bottom:30px;}

/* map */
#map{background:radial-gradient(ellipse at 50% 20%,#1a1233 0,#0a0820 60%,#06040e 100%);overflow-y:auto;}
.map-head{padding:52px 20px 6px;text-align:center;}
.map-floor{font-size:13px;letter-spacing:3px;color:var(--gold);}
.map-hp{font-size:12px;color:var(--muted);margin-top:4px;}
.map-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;}
.map-q{font-size:15px;color:var(--gold-light);letter-spacing:1px;margin-bottom:4px;}
.node{width:min(420px,92vw);background:rgba(20,16,36,.8);border:1px solid rgba(201,168,76,.35);border-radius:10px;padding:16px 18px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px;}
.node:hover{border-color:var(--gold);background:rgba(40,32,64,.85);transform:translateY(-2px);}
.node .ic{font-size:30px;flex-shrink:0;}
.node .nz{font-size:16px;color:var(--gold-light);letter-spacing:1px;} .node .nd{font-size:12px;color:var(--muted);margin-top:3px;}
.relic-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 20px 14px;}
.relic{font-size:20px;filter:drop-shadow(0 0 6px rgba(201,168,76,.4));cursor:default;}

/* battle */
#battle{background:#0a0713;}
#b-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;}
#b-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,4,14,.55),rgba(6,4,14,.8) 55%,rgba(6,4,14,.97));}
.b-top{position:relative;z-index:2;padding:46px 16px 6px;display:flex;justify-content:space-between;align-items:flex-start;}
.enemy-box{position:relative;z-index:2;text-align:center;margin-top:2px;}
.enemy-art{width:min(150px,34vw);height:min(150px,34vw);margin:0 auto;position:relative;}
.enemy-art img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid rgba(224,80,58,.4);}
.enemy-emoji{display:none;width:100%;height:100%;border-radius:12px;border:1px dashed rgba(201,168,76,.5);background:rgba(20,10,20,.6);align-items:center;justify-content:center;font-size:60px;}
.enemy-art.hit{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-7px,2px)}50%{transform:translate(6px,-2px)}75%{transform:translate(-4px,1px)}}
.intent{font-size:13px;color:#ffce9a;letter-spacing:1px;margin-top:6px;min-height:18px;}
.ename{font-size:16px;color:#ffb9a6;letter-spacing:2px;margin-top:4px;}
.emyth{font-size:11px;font-style:italic;color:#d8c79a;max-width:460px;margin:4px auto 0;line-height:1.55;padding:0 12px;}
.emyth .msrc{font-style:normal;color:var(--muted);}
.hpwrap{width:min(240px,66vw);margin:4px auto 0;}
.hpbar{height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;position:relative;}
.hpbar>.fill{height:100%;transition:width .3s;}
.ehp>.fill{background:linear-gradient(90deg,#7a1e14,#e0503a);}
.php>.fill{background:linear-gradient(90deg,#2f7a3a,#5ac878);}
.hpbar>.blk{position:absolute;right:4px;top:-1px;font-size:11px;color:#bfe0ff;}
.hp-num{font-size:11px;color:var(--muted);text-align:center;margin-top:2px;}
.status-row{display:flex;gap:8px;justify-content:center;margin-top:4px;font-size:11px;color:#ffce9a;min-height:14px;}

.player-zone{position:relative;z-index:2;margin-top:auto;}
.p-info{display:flex;justify-content:space-between;align-items:center;padding:2px 16px 4px;}
.energy{font-size:14px;color:var(--gold-light);letter-spacing:1px;}
.energy b{font-size:18px;color:#ffe9a8;}
#end-turn{padding:8px 16px;font-size:13px;}
.php-wrap{padding:0 16px 4px;}
.hand{display:flex;gap:8px;justify-content:center;align-items:flex-end;padding:6px 8px 12px;overflow-x:auto;min-height:150px;}
.card{flex:0 0 auto;width:104px;min-height:140px;background:linear-gradient(160deg,#2a2340,#171029);border:1px solid var(--gold);border-radius:9px;padding:8px 8px 10px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;position:relative;}
.card:hover{transform:translateY(-10px);box-shadow:0 8px 24px rgba(0,0,0,.5);}
.card.attack{border-color:#e0714a;} .card.skill{border-color:#5a9cff;} .card.power{border-color:#c69cff;}
.card.unafford{opacity:.45;filter:grayscale(.4);}
.card .cost{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:#1a1030;border:2px solid var(--gold);color:#ffe9a8;font-size:14px;display:flex;align-items:center;justify-content:center;}
.card .cn{font-size:13px;color:var(--gold-light);text-align:center;margin-top:8px;letter-spacing:1px;}
.card .ct{font-size:9px;color:var(--muted);text-align:center;margin:1px 0 5px;}
.card .cd{font-size:10.5px;color:var(--text);line-height:1.45;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;}

/* overlays */
.overlay{position:absolute;inset:0;z-index:30;background:rgba(6,4,14,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;overflow-y:auto;}
.overlay.on{display:flex;}
.ov-t{font-size:26px;letter-spacing:3px;color:var(--gold-light);margin-bottom:8px;text-shadow:0 0 18px rgba(201,168,76,.5);}
.ov-x{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.8;max-width:460px;}
.reward-cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:18px;}
.gameover .ov-t{color:#ff8a72;}
</style>

<div id="app">
  <a id="home-btn" href="./index.html" title="選單 / Menu">⌂</a>
  <button id="fs-btn" onclick="cycleFS()" title="文字大小 / Text size">A</button>
  <button id="music-btn" onclick="toggleMusic()" title="音樂 / Music">🔊</button>
  <button id="lang-btn" onclick="toggleLang()">EN</button>

  <section id="title" class="screen center active">

    <div class="t-sub" id="tt-sub"></div>

  <section id="map" class="screen">
    <div class="map-head">

  <section id="battle" class="screen">

    <div class="b-top">
      <div style="font-size:12px;color:var(--muted)" id="b-deckinfo"></div>
    </div>
    <div class="enemy-box">

      </div>
      <div class="intent" id="enemy-intent"></div>
      <div class="ename" id="enemy-name"></div>
      <div class="emyth" id="enemy-myth"></div>
      <div class="hpwrap"><div class="hpbar ehp"><div class="fill" id="enemy-hp-fill"></div><span class="blk" id="enemy-blk"></span></div><div class="hp-num" id="enemy-hp-num"></div></div>
      <div class="status-row" id="enemy-status"></div>
    </div>

    <div class="player-zone">
      <div class="status-row" id="player-status"></div>
      <div class="php-wrap"><div class="hpbar php"><div class="fill" id="player-hp-fill"></div><span class="blk" id="player-blk"></span></div><div class="hp-num" id="player-hp-num"></div></div>
      <div class="p-info">
        <div class="energy">⚡ <b id="energy">3</b>/<span id="maxenergy">3</span></div>
        <button class="btn btn-sm" id="end-turn" onclick="endTurn()">結束回合 ▶</button>
      </div>
      <div class="hand" id="hand"></div>
    </div>

    <div class="overlay" id="ov-reward">
      <div class="ov-t" id="rw-t">戰利品</div>
      <div class="ov-x" id="rw-x"></div>
      <div class="reward-cards" id="rw-cards"></div>
      <button class="btn btn-sm" onclick="skipReward()" id="rw-skip">略過 · 前進 ▶</button>
    </div>
    <div class="overlay gameover" id="ov-over">
      <div class="ov-t" id="go-t">英雄倒下了</div>
      <div class="ov-x" id="go-x"></div>
      <button class="btn btn-sm" onclick="toTitle()" id="go-btn">重新構築 · RESTART</button>
    </div>
  </section>

  <section id="event" class="screen center">
    <div class="ov-t" id="ev-t" style="margin-bottom:14px"></div>
    <div class="ov-x" id="ev-x"></div>
    <div id="ev-choices" style="display:flex;flex-direction:column;gap:12px;width:min(420px,92vw)"></div>
  </section>

  <section id="win" class="screen center" style="background:radial-gradient(ellipse at 50% 25%,#2a1030 0,#0a0820 55%,#06040e 100%)">
    <div class="t-zh" id="w-zh">英雄鑄成</div>
    <div class="t-en">A HERO IS FORGED</div>
    <div class="ov-x" id="w-x" style="margin-top:18px"></div>
    <div style="margin:26px auto 4px;text-align:center;max-width:600px">
      <div style="font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px">繼續旅程 · CONTINUE</div>
      <a href="./hall.html" style="display:inline-block;margin:4px 5px;padding:9px 15px;border:1px solid var(--gold);border-radius:4px;color:var(--gold-light);text-decoration:none;font-size:13px;letter-spacing:1px">🏛️ 英雄殿堂 · Hall</a>
      <a href="./beast_trials.html" style="display:inline-block;margin:4px 5px;padding:9px 15px;border:1px solid var(--gold);border-radius:4px;color:var(--gold-light);text-decoration:none;font-size:13px;letter-spacing:1px">⚔️ 弒魔英雄旅 · Beasts</a>
    </div>
    <button class="btn btn-sm" onclick="toTitle()" id="w-btn">再走一輪 · AGAIN</button>
  </section>
</div>

 charm:{e:'🛡️',zh:'鐵護符',en:'Iron Charm',dz:'每場戰鬥開始 +5 格擋',de:'Start each combat with 5 Block'},

// ═══════════════ run state ═══════════════
let G=null;
function freshRun(){
  return {maxHP:72,hp:72,gold:0,floor:0,relics:[],
    deck:['strike','strike','strike','strike','strike','defend','defend','defend','defend','bash'],
    demonIx:0,eliteIx:0,
    // combat
    energy:0,maxEnergy:3,block:0,str:0,weak:0,vuln:0,thorns:0,perTurnStr:0,
    draw:[],hand:[],discard:[],exhaust:[],enemy:null,turn:0,busy:false};
}

function applyLang(){
  const u=UI[LANG];
  $('lang-btn').textContent=LANG==='zh'?'EN':'中';
  $('tt-zh').textContent=LANG==='zh'?'英雄牌旅':'The Deckbound Hero';
  $('tt-sub').textContent=u.sub; $('tt-btn').textContent=u.begin;
  $('end-turn').textContent=u.endturn; $('rw-skip').textContent=u.skip;
  $('go-t').textContent=u.over; $('go-x').textContent=u.overx; $('go-btn').textContent=u.restart;
  $('w-zh').textContent=LANG==='zh'?'英雄鑄成':'A Hero Is Forged'; $('w-x').textContent=u.winx; $('w-btn').textContent=u.again;
  $('rw-t').textContent=u.loot;
}
function toggleLang(){LANG=LANG==='zh'?'en':'zh';applyLang();
  if($('map').classList.contains('active'))renderMap();
  if($('battle').classList.contains('active'))renderBattle();}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');
  const th={title:'epic',map:'ambient',win:'triumph'};if(th[id]&&window.Music)Music.set(th[id]);}
function toTitle(){$('ov-over').classList.remove('on');$('ov-reward').classList.remove('on');show('title');if(window.Music)Music.set('epic');}
function newRun(){G=freshRun();show('map');renderMap();}

// ═══════════════ map ═══════════════
function renderMap(){
  const u=UI[LANG];
  $('m-floor').textContent=u.floor.replace('%n',G.floor+ (G.floor>=12?0:1));
  $('m-hp').textContent=u.hp.replace('%h',G.hp).replace('%m',G.maxHP).replace('%g',G.gold);
  $('m-relics').innerHTML=G.relics.map(r=>`<span class="relic" title="${RELICS[r][L()==='zh'?'zh':'en']}">${RELICS[r].e}</span>`).join('');
  const body=$('m-body'); body.innerHTML='';
  const q=document.createElement('div'); q.className='map-q'; q.textContent=u.choose; body.appendChild(q);
  if(G.floor>=11){ // final boss floor
    body.appendChild(makeNode('boss')); return;
  }
  // offer two node choices
  const types=rollNodes();
  types.forEach(t=>body.appendChild(makeNode(t)));
}
function rollNodes(){
  const bag=['battle','battle','battle','event','rest','treasure','elite'];
  let a=pick(bag), b=pick(bag); let g=0;
  while(b===a && g++<10) b=pick(bag);
  return [a,b];
}
function makeNode(t){
  const u=UI[LANG];
  const d=document.createElement('div'); d.className='node';
  d.innerHTML=`<span class="ic">${u['n_'+t]}</span><div><div class="nz">${u[t]}</div><div class="nd">${u[t+'d']}</div></div>`;
  d.onclick=()=>chooseNode(t);
  return d;
}
function chooseNode(t){
  if(t==='battle') startCombat(nextDemon(),false);
  else if(t==='elite') startCombat(nextElite(),false);
  else if(t==='boss') startCombat(JSON.parse(JSON.stringify(BOSS)),true);
  else if(t==='rest'){ G.hp=Math.min(G.maxHP,G.hp+Math.round(G.maxHP*0.3)); notifyEvent(UI[LANG].restHeal,()=>advance()); }
  else if(t==='treasure'){ grantRelic(); G.gold+=rint(15,30); notifyEvent(L()==='zh'?'你打開寶箱，獲得了神器與金幣。':'You open the chest — a relic and gold.',()=>advance()); }
  else if(t==='event') runEvent();
}
function nextDemon(){const d=JSON.parse(JSON.stringify(DEMONS[G.demonIx%DEMONS.length]));G.demonIx++;
  const t=Math.floor(G.floor/4); d.hp+=t*6; return d;}
function nextElite(){const d=JSON.parse(JSON.stringify(ELITES[G.eliteIx%ELITES.length]));G.eliteIx++;
  d.hp+=Math.floor(G.floor/3)*6; return d;}
function advance(){G.floor++; if(G.floor>=12){/* handled by boss node at 11 */} show('map'); renderMap();}

// ═══════════════ events ═══════════════
function notifyEvent(text,then){
  show('event'); $('ev-t').textContent=L()==='zh'?'…':'…'; $('ev-x').textContent=text;
  const c=$('ev-choices'); c.innerHTML='';
  const b=document.createElement('button'); b.className='btn btn-sm'; b.textContent=L()==='zh'?'繼續 ▶':'Continue ▶';
  b.onclick=then; c.appendChild(b);
}
const EVENTS=[
 {zh:'岔路旁的老者',en:'The Old One at the Crossroads',
  tz:'一位老者遞來一枚溫熱的護符。「拿去，孩子。」',te:'An old one offers a warm amulet. "Take it, child."',
  opts:[{z:'收下（獲得神器）',e:'Accept (gain a relic)',fn:()=>{grantRelic();}},
        {z:'婉拒（回復 10 生命）',e:'Decline (heal 10)',fn:()=>{G.hp=Math.min(G.maxHP,G.hp+10);}}]},
 {zh:'受詛咒的祭壇',en:'The Cursed Altar',
  tz:'祭壇低語：「以血換力。」',te:'The altar whispers: "Power, for blood."',
  opts:[{z:'獻血（-8 生命，獲得一張強力牌）',e:'Bleed (-8 HP, gain a card)',fn:()=>{G.hp=Math.max(1,G.hp-8);G.deck.push(pick(POOL));}},
        {z:'離開',e:'Leave',fn:()=>{}}]},
 {zh:'遺落的寶箱',en:'A Forgotten Chest',
  tz:'箱裡有金幣的微光。',te:'Coins glimmer inside.',
  opts:[{z:'拿取金幣（+30）',e:'Take gold (+30)',fn:()=>{G.gold+=30;}},
        {z:'更仔細地找（一半機率獲得神器）',e:'Search deeper (50% relic)',fn:()=>{if(Math.random()<0.5)grantRelic();else G.gold+=10;}}]},
 {zh:'靜謐的清泉',en:'A Quiet Spring',
  tz:'泉水映著你疲憊的臉。',te:'The spring reflects your weary face.',
  opts:[{z:'飲水（回復 30% 生命）',e:'Drink (heal 30%)',fn:()=>{G.hp=Math.min(G.maxHP,G.hp+Math.round(G.maxHP*0.3));}},
        {z:'淬鍊心志（生命上限 +6）',e:'Temper (max HP +6)',fn:()=>{G.maxHP+=6;G.hp+=6;}}]},
];
function runEvent(){
  const ev=pick(EVENTS); show('event');
  $('ev-t').textContent=ev[L()==='zh'?'zh':'en']; $('ev-x').textContent=ev[L()==='zh'?'tz':'te'];
  const c=$('ev-choices'); c.innerHTML='';
  ev.opts.forEach(o=>{const b=document.createElement('button');b.className='btn btn-sm';
    b.textContent=L()==='zh'?o.z:o.e; b.onclick=()=>{o.fn();advance();}; c.appendChild(b);});
}
function grantRelic(){
  const have=new Set(G.relics); const avail=Object.keys(RELICS).filter(r=>!have.has(r));
  if(!avail.length) { G.gold+=25; return; }
  const r=pick(avail); G.relics.push(r);
  if(r==='gem'){ G.maxHP+=10; G.hp+=10; }
}

// ═══════════════ combat ═══════════════
function enemyImgFail(){$('enemy-img').style.display='none';$('enemy-emoji').style.display='flex';}
function startCombat(enemy,isBoss){
  G.enemy={...enemy,maxHP:enemy.hp,block:0,str:0,weak:0,vuln:0,ix:0};
  G.block=0;G.str=0;G.weak=0;G.vuln=0;G.thorns=0;G.perTurnStr=0;G.turn=0;G.busy=false;
  G.draw=shuffle([...G.deck]); G.hand=[]; G.discard=[]; G.exhaust=[];
  // combat-start relics
  if(G.relics.includes('heart'))G.str+=1;
  if(G.relics.includes('crown'))G.thorns+=3;
  if(window.Music)Music.set(isBoss?'epic':(enemy.elite?'epic':'drive'));
  show('battle');
  $('b-bg').src=enemy.bg; $('b-bg').onerror=function(){this.style.opacity=0;};
  const img=$('enemy-img'); $('enemy-emoji').style.display='none'; img.style.display='block'; img.src=enemy.img;
  $('enemy-emoji').textContent=enemy.e;
  const mi={'惰影':0,'懼魔':1,'惑蛇':2,'傲魔巨像':3,'妒獸':4,'怒炎':5,'貪淵龍':6,'悔靈':7,'孤魘':8,'絕望巨影':9,'虛無':10,'心魔·你自己':11}[enemy.zh];
  const m=mythEcho(mi==null?0:mi);
  $('enemy-myth').innerHTML=`🏛️ ${LANG==='zh'?m.ez:m.ee}<br>「${LANG==='zh'?m.qz:m.qe}」<span class="msrc">— ${LANG==='zh'?m.sz:m.se}</span>`;
  startTurn();
}
function startTurn(){
  G.turn++; G.block=0; // block resets
  if(G.relics.includes('charm'))G.block+=5;
  G.energy=G.maxEnergy;
  if(G.perTurnStr)G.str+=G.perTurnStr;
  let d=5; if(G.turn===1 && G.relics.includes('book'))d+=2;
  drawCards(d);
  computeIntent();
  G.busy=false;
  renderBattle();
}
function drawCards(n){
  for(let i=0;i<n;i++){
    if(!G.draw.length){ if(!G.discard.length)break; G.draw=shuffle(G.discard); G.discard=[]; }
    G.hand.push(G.draw.pop());
  }
}
function computeIntent(){ const e=G.enemy; e.intent=e.pat[e.ix%e.pat.length]; }
function intentText(){
  const e=G.enemy, it=e.intent; if(!it)return'';
  if(it.t==='atk'){let dmg=it.v+e.str; if(e.weak>0)dmg=Math.floor(dmg*0.75); if(G.vuln>0)dmg=Math.ceil(dmg*1.5); return (L()==='zh'?'⚔️ 攻擊 ':'⚔️ Attack ')+dmg;}
  if(it.t==='def')return L()==='zh'?'🛡️ 防禦':'🛡️ Defend';
  if(it.t==='buff')return L()==='zh'?'💪 蓄力':'💪 Buff';
  if(it.t==='weak')return L()==='zh'?'🌀 削弱':'🌀 Weaken';
  return '';
}
function statusChips(o,isEnemy){
  const t=[]; if(o.block>0&&isEnemy)t.push('🛡️'+o.block);
  if(o.str>0)t.push((L()==='zh'?'力量':'Str')+' '+o.str);
  if(o.vuln>0)t.push((L()==='zh'?'易傷':'Vuln')+' '+o.vuln);
  if(o.weak>0)t.push((L()==='zh'?'虛弱':'Weak')+' '+o.weak);
  if(!isEnemy&&o.thorns>0)t.push('🌵'+o.thorns);
  return t.join('　');
}
function renderBattle(){
  const e=G.enemy,u=UI[LANG];
  $('enemy-name').textContent=e[L()==='zh'?'zh':'en'];
  $('enemy-intent').textContent=intentText();
  $('enemy-hp-fill').style.width=(Math.max(0,e.hp)/e.maxHP*100)+'%';
  $('enemy-hp-num').textContent=Math.max(0,e.hp)+' / '+e.maxHP;
  $('enemy-blk').textContent=e.block>0?('🛡️'+e.block):'';
  $('enemy-status').textContent=statusChips(e,true);
  $('player-hp-fill').style.width=(Math.max(0,G.hp)/G.maxHP*100)+'%';
  $('player-hp-num').textContent=Math.max(0,G.hp)+' / '+G.maxHP;
  $('player-blk').textContent=G.block>0?('🛡️'+G.block):'';
  $('player-status').textContent=statusChips(G,false);
  $('energy').textContent=G.energy; $('maxenergy').textContent=G.maxEnergy;
  $('b-deckinfo').textContent=u.deckinfo.replace('%d',G.draw.length).replace('%x',G.discard.length);
  const hand=$('hand'); hand.innerHTML='';
  G.hand.forEach((cid,i)=>{
    const c=CARDS[cid]; const el=document.createElement('div');
    el.className='card '+c.type+(c.cost>G.energy?' unafford':'');
    el.innerHTML=`<div class="cost">${c.cost}</div><div class="cn">${c[L()==='zh'?'zh':'en']}</div>
      <div class="ct">${c.type==='attack'?(L()==='zh'?'攻擊':'Attack'):c.type==='power'?(L()==='zh'?'能力':'Power'):(L()==='zh'?'技能':'Skill')}</div>
      <div class="cd">${c[L()==='zh'?'dz':'de']}</div>`;
    el.onclick=()=>playCard(i);
    hand.appendChild(el);
  });
}
function enemyHit(){const a=$('enemy-art');a.classList.remove('hit');void a.offsetWidth;a.classList.add('hit');}
function dealToEnemy(base){
  let dmg=base+G.str; if(G.weak>0)dmg=Math.floor(dmg*0.75); if(G.enemy.vuln>0)dmg=Math.ceil(dmg*1.5);
  dmg=Math.max(0,dmg);
  if(G.enemy.block>0){const a=Math.min(G.enemy.block,dmg);G.enemy.block-=a;dmg-=a;}
  G.enemy.hp-=dmg; enemyHit();
}
function playCard(i){
  if(G.busy)return; const cid=G.hand[i]; const c=CARDS[cid]; if(!c||c.cost>G.energy)return;
  G.energy-=c.cost;
  if(c.dmg){ const hits=c.hits||1; for(let h=0;h<hits;h++) dealToEnemy(c.dmg);
    if(c.execVuln&&G.enemy.vuln>0) dealToEnemy(c.execVuln); }
  if(c.block)G.block+=c.block;
  if(c.vuln)G.enemy.vuln+=c.vuln;
  if(c.weak)G.enemy.weak+=c.weak;
  if(c.strGain)G.str+=c.strGain;
  if(c.thorns)G.thorns+=c.thorns;
  if(c.perTurnStr)G.perTurnStr+=c.perTurnStr;
  if(c.heal)G.hp=Math.min(G.maxHP,G.hp+c.heal);
  if(c.energy)G.energy+=c.energy;
  if(c.cleanse){G.weak=0;G.vuln=0;}
  if(c.draw)drawCards(c.draw);
  // move card out of hand
  G.hand.splice(i,1);
  if(c.exhaust)G.exhaust.push(cid); else G.discard.push(cid);
  if(G.enemy.hp<=0){ renderBattle(); setTimeout(winCombat,500); return; }
  renderBattle();
}
function endTurn(){
  if(G.busy)return; G.busy=true;
  // move hand to discard
  G.discard.push(...G.hand); G.hand=[];
  renderBattle();
  setTimeout(enemyTurn,350);
}
function enemyTurn(){
  const e=G.enemy, it=e.intent;
  if(it.t==='atk'){
    let dmg=it.v+e.str; if(e.weak>0)dmg=Math.floor(dmg*0.75); if(G.vuln>0)dmg=Math.ceil(dmg*1.5); dmg=Math.max(0,dmg);
    if(G.block>0){const a=Math.min(G.block,dmg);G.block-=a;dmg-=a;}
    G.hp-=dmg;
    if(G.thorns>0){ e.hp-=G.thorns; enemyHit(); }
  } else if(it.t==='def'){ e.block+=it.v; }
  else if(it.t==='buff'){ e.str+=it.v; }
  else if(it.t==='weak'){ G.weak+=it.v; }
  e.ix++;
  // decrement debuffs (both)
  if(e.vuln>0)e.vuln--; if(e.weak>0)e.weak--;
  if(G.vuln>0)G.vuln--; if(G.weak>0)G.weak--;
  renderBattle();
  if(e.hp<=0){ setTimeout(winCombat,400); return; }
  if(G.hp<=0){ setTimeout(gameOver,400); return; }
  setTimeout(startTurn,300);
}
function winCombat(){
  const boss=G.enemy.boss;
  if(G.relics.includes('amulet'))G.hp=Math.min(G.maxHP,G.hp+8);
  G.gold+=rint(10,20);
  if(G.enemy.elite||boss)grantRelic();
  if(boss){ show('win'); if(window.Music)Music.set('triumph'); return; }
  // card reward
  show('battle'); // stay, open overlay
  const u=UI[LANG]; $('rw-x').textContent='';
  const cards=shuffle([...POOL]).slice(0,3);
  const wrap=$('rw-cards'); wrap.innerHTML='';
  cards.forEach(cid=>{
    const c=CARDS[cid]; const el=document.createElement('div'); el.className='card '+c.type;
    el.innerHTML=`<div class="cost">${c.cost}</div><div class="cn">${c[L()==='zh'?'zh':'en']}</div>
      <div class="ct">${c.type==='attack'?(L()==='zh'?'攻擊':'Attack'):c.type==='power'?(L()==='zh'?'能力':'Power'):(L()==='zh'?'技能':'Skill')}</div>
      <div class="cd">${c[L()==='zh'?'dz':'de']}</div>`;
    el.onclick=()=>{G.deck.push(cid);skipReward();};
    wrap.appendChild(el);
  });
  if(window.Music)Music.set('triumph');
  $('ov-reward').classList.add('on');
}
function skipReward(){ $('ov-reward').classList.remove('on'); advance(); }
function gameOver(){ show('battle'); $('ov-over').classList.add('on'); }

// ═══════════════ music (shared engine) ═══════════════
const Music = (function(){
  let ctx=null, master=null, bus=null, timer=null;
  let muted=false, nextBarTime=0, barIx=0;
  let current='epic', pending='epic';
  const NOTE={A:0,'A#':1,B:2,C:3,'C#':4,D:5,'D#':6,E:7,F:8,'F#':9,G:10,'G#':11};
  const hz=(root,s)=>root*Math.pow(2,s/12);
  const triad=(name,type)=>{const r=NOTE[name],t=type==='min'?3:4;return [r,r+t,r+7];};

  function impulse(sec,decay){
    const rate=ctx.sampleRate,len=Math.floor(rate*sec),buf=ctx.createBuffer(2,len,rate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    return buf;
  }
  function ensure(){
    if(ctx) return true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:0.30;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=3; comp.attack.value=0.006; comp.release.value=0.3;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200;
    master.connect(comp); comp.connect(lp); lp.connect(ctx.destination);
    // instrument bus -> dry + reverb (lush hall for an epic, less "raw" sound)
    bus=ctx.createGain(); bus.connect(master);
    const rev=ctx.createConvolver(); rev.buffer=impulse(2.8,2.2);
    const wet=ctx.createGain(); wet.gain.value=0.85;
    bus.connect(rev); rev.connect(wet); wet.connect(master);
    return true;
  }

  // ── warm layered voice: two slightly-detuned oscillators through a lowpass,
  //    smooth ADSR, optional gentle vibrato — far softer than a bare sawtooth ──
  function voice(t,freq,dur,o){
    o=o||{};
    const peak=o.peak!=null?o.peak:0.14,a=o.a!=null?o.a:0.04,r=o.r!=null?o.r:0.25;
    const cut=o.cut||2600,type=o.type||'sawtooth';
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.setValueAtTime(peak,t+Math.max(a+0.005,dur-r));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut;
    f.connect(g); g.connect(bus);
    const base=o.detune||0;
    const mk=(det)=>{const os=ctx.createOscillator();os.type=type;os.frequency.value=freq;os.detune.value=det;os.connect(f);os.start(t);os.stop(t+dur+0.06);return os;};
    const o1=mk(base-6),o2=mk(base+6);
    if(o.vib){const vo=ctx.createOscillator();vo.type='sine';vo.frequency.value=5.2;const vg=ctx.createGain();vg.gain.value=o.vib;vo.connect(vg);vg.connect(o1.detune);vg.connect(o2.detune);vo.start(t);vo.stop(t+dur+0.06);}
  }
  const strings=(t,tri,dur,gain)=>tri.concat([tri[0]+12]).forEach(s=>voice(t,hz(110,s),dur,{peak:gain||0.05,a:0.55,r:0.75,cut:1300,type:'sawtooth'}));
  const brass=(t,tri,dur,gain)=>tri.concat([tri[0]+12]).forEach((s,i)=>voice(t,hz(110,s),dur,{peak:(gain||0.08)/(1+i*0.2),a:0.05,r:0.18,cut:2000,type:'sawtooth',detune:i%2?5:-5}));
  const melo=(t,semi,dur,gain,base)=>voice(t,hz(base||220,semi),dur,{peak:gain||0.16,a:0.06,r:0.2,cut:3000,type:'triangle',vib:6});
  const harp=(t,semi,dur,base)=>voice(t,hz(base||220,semi),dur||0.5,{peak:0.1,a:0.006,r:0.45,cut:3200,type:'triangle'});
  function bassv(t,semi,dur,gain){
    voice(t,hz(55,semi),dur,{peak:gain||0.24,a:0.02,r:0.14,cut:1300,type:'triangle'});
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=hz(55,semi);

  function scheduler(){
    if(!ctx) return;
    while(nextBarTime < ctx.currentTime + 0.25){
      const th=THEMES[current]||THEMES.epic;
