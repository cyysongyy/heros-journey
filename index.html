<!DOCTYPE html>
<html lang="zh-TW">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英雄旅程 · Hero's Journey</title>
<style>
:root{--gold:#c9a84c;--gold-light:#e8d48a;--text:#e7e0d0;--muted:rgba(200,180,140,0.62);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{background:#07050f;color:var(--text);font-family:"Noto Serif TC","Songti TC",Georgia,serif;
  min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 20%,#1b1240 0%,#0a0820 55%,#06040e 100%);}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.12;}
#lang-btn{position:fixed;top:14px;right:14px;z-index:10;background:rgba(0,0,0,.55);border:1px solid var(--gold);
  color:var(--gold);cursor:pointer;border-radius:3px;font-family:inherit;letter-spacing:1px;padding:6px 14px;font-size:12px;}
#music-btn{position:fixed;top:14px;right:74px;z-index:10;background:rgba(0,0,0,.55);border:1px solid var(--gold);
  color:var(--gold);cursor:pointer;border-radius:3px;font-family:inherit;padding:6px 9px;font-size:14px;line-height:1;}
#music-btn.muted{opacity:.5;}
.wrap{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:56px 22px 48px;
  display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.hero{width:min(180px,44vw);height:min(180px,44vw);border-radius:50%;object-fit:cover;border:3px solid var(--gold);
  box-shadow:0 0 44px rgba(201,168,76,.35),inset 0 0 22px rgba(0,0,0,.6);margin-bottom:20px;animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.t-zh{font-size:clamp(32px,9vw,50px);color:var(--gold-light);letter-spacing:12px;text-shadow:0 0 26px rgba(201,168,76,.5);text-align:center;}
.t-en{font-size:13px;letter-spacing:6px;color:var(--muted);margin-top:10px;text-align:center;}
.lead{font-size:13.5px;color:var(--muted);margin:22px 0 30px;text-align:center;line-height:1.9;max-width:480px;white-space:pre-line;}
.cards{display:flex;flex-direction:column;gap:16px;width:100%;}
.card{display:block;text-decoration:none;color:inherit;background:rgba(20,16,36,.72);
  border:1px solid rgba(201,168,76,.32);border-radius:10px;padding:20px 22px;transition:all .22s;position:relative;overflow:hidden;}
.card:hover{border-color:var(--gold);background:rgba(40,32,64,.82);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4);}
.card .row{display:flex;align-items:center;gap:16px;}
.card .ic{font-size:34px;line-height:1;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(201,168,76,.35));}
.card .zh{font-size:19px;color:var(--gold-light);letter-spacing:2px;}
.card .en{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:2px;}
.card .desc{font-size:13px;color:var(--text);opacity:.85;line-height:1.7;margin-top:12px;}
.card .go{position:absolute;right:20px;top:22px;color:var(--gold);opacity:.6;font-size:18px;}
.foot{margin-top:30px;font-size:11px;color:var(--muted);letter-spacing:1px;text-align:center;line-height:1.8;}
</style>

<div id="bg"><img src="./images/img0.png" alt="" onerror="this.style.display='none'"></div>
<button id="music-btn" onclick="toggleMusic()" title="音樂 / Music">🔊</button>
<button id="lang-btn" onclick="toggleLang()">EN</button>

<div class="wrap">
  <img class="hero" src="./images/img15.png" alt="" onerror="this.style.display='none'">
  <div class="t-zh" id="t-zh">英雄旅程</div>
  <div class="t-en">HERO'S JOURNEY</div>
  <div class="lead" id="lead"></div>

  <div class="cards">
    <a class="card" href="./heros_journey_game.html">
      <span class="go">▶</span>
      <div class="row"><span class="ic">📖</span><div>
        <div class="zh" id="c1-zh">故事模式</div><div class="en">STORY MODE</div></div></div>
      <div class="desc" id="c1-d"></div>
    </a>
    <a class="card" href="./your_odyssey.html">
      <span class="go">▶</span>
      <div class="row"><span class="ic">🧭</span><div>
        <div class="zh" id="c2-zh">你的英雄旅程</div><div class="en">YOUR OWN ODYSSEY</div></div></div>
      <div class="desc" id="c2-d"></div>
    </a>
    <a class="card" href="./beast_trials.html">
      <span class="go">▶</span>
      <div class="row"><span class="ic">⚔️</span><div>
        <div class="zh" id="c3-zh">弒魔英雄旅</div><div class="en">TRIALS OF THE TWELVE BEASTS</div></div></div>
      <div class="desc" id="c3-d"></div>
    </a>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
let LANG='zh';
const T={
  zh:{lead:'坎伯的十二階段，三種走法。\n選一種方式，踏上屬於你的英雄之路。',
    c1:'扮演吉爾伽美什，穿越世界神話，走過坎伯十二階段的史詩敘事與抉擇。',
    c2:'這一次英雄是你——用你自己的人生走完十二道門檻，結局生成你的專屬史詩。',
    c3:'回合制斬妖之旅：擊敗惰、懼、傲、絕望……十二頭心魔，真正成為英雄。',
    foot:'坎伯（Joseph Campbell）十二階段視覺化專案 · 建議用手機或全螢幕遊玩',lang:'EN'},
  en:{lead:'Campbell’s twelve stages, three ways to walk them.\nChoose your path to the hero’s road.',
    c1:'Play Gilgamesh across world myths — the full story mode of choices through Campbell’s twelve stages.',
    c2:'This time the hero is you — walk the twelve thresholds as yourself, and forge your own epic at the end.',
    c3:'A turn-based road of slaying: defeat Sloth, Fear, Pride, Despair… twelve inner demons, and truly become a hero.',
    foot:'A visualization of Joseph Campbell’s twelve stages · best played fullscreen on mobile or browser',lang:'中'}
};
function apply(){
  const t=T[LANG];
  document.getElementById('t-zh').textContent = LANG==='zh'?'英雄旅程':'Hero’s Journey';
  document.getElementById('lead').textContent=t.lead;
  document.getElementById('c1-zh').textContent=LANG==='zh'?'故事模式':'Story Mode';
  document.getElementById('c2-zh').textContent=LANG==='zh'?'你的英雄旅程':'Your Own Odyssey';
  document.getElementById('c3-zh').textContent=LANG==='zh'?'弒魔英雄旅':'Trials of the Beasts';
  document.getElementById('c1-d').textContent=t.c1;
  document.getElementById('c2-d').textContent=t.c2;
  document.getElementById('c3-d').textContent=t.c3;
  document.getElementById('foot').textContent=t.foot;
  document.getElementById('lang-btn').textContent=t.lang;
  document.documentElement.lang = LANG==='zh'?'zh-TW':'en';
}
function toggleLang(){ LANG = LANG==='zh'?'en':'zh'; apply(); }
apply();

// ── menu background music (shared engine) ──
const Music = (function(){
  let ctx=null, master=null, bus=null, timer=null;
  let muted=false, nextBarTime=0, barIx=0;
  let current='epic', pending='epic';
  const NOTE={A:0,'A#':1,B:2,C:3,'C#':4,D:5,'D#':6,E:7,F:8,'F#':9,G:10,'G#':11};
  const hz=(root,s)=>root*Math.pow(2,s/12);
  const triad=(name,type)=>{const r=NOTE[name],t=type==='min'?3:4;return [r,r+t,r+7];};

  function impulse(sec,decay){
    const rate=ctx.sampleRate,len=Math.floor(rate*sec),buf=ctx.createBuffer(2,len,rate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    return buf;
  }
  function ensure(){
    if(ctx) return true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:0.30;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=3; comp.attack.value=0.006; comp.release.value=0.3;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200;
    master.connect(comp); comp.connect(lp); lp.connect(ctx.destination);
    // instrument bus -> dry + reverb (lush hall for an epic, less "raw" sound)
    bus=ctx.createGain(); bus.connect(master);
    const rev=ctx.createConvolver(); rev.buffer=impulse(2.8,2.2);
    const wet=ctx.createGain(); wet.gain.value=0.85;
    bus.connect(rev); rev.connect(wet); wet.connect(master);
    return true;
  }

  // ── warm layered voice: two slightly-detuned oscillators through a lowpass,
  //    smooth ADSR, optional gentle vibrato — far softer than a bare sawtooth ──
  function voice(t,freq,dur,o){
    o=o||{};
    const peak=o.peak!=null?o.peak:0.14,a=o.a!=null?o.a:0.04,r=o.r!=null?o.r:0.25;
    const cut=o.cut||2600,type=o.type||'sawtooth';
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.setValueAtTime(peak,t+Math.max(a+0.005,dur-r));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut;
    f.connect(g); g.connect(bus);
    const base=o.detune||0;
    const mk=(det)=>{const os=ctx.createOscillator();os.type=type;os.frequency.value=freq;os.detune.value=det;os.connect(f);os.start(t);os.stop(t+dur+0.06);return os;};
    const o1=mk(base-6),o2=mk(base+6);
    if(o.vib){const vo=ctx.createOscillator();vo.type='sine';vo.frequency.value=5.2;const vg=ctx.createGain();vg.gain.value=o.vib;vo.connect(vg);vg.connect(o1.detune);vg.connect(o2.detune);vo.start(t);vo.stop(t+dur+0.06);}
  }
  const strings=(t,tri,dur,gain)=>tri.concat([tri[0]+12]).forEach(s=>voice(t,hz(110,s),dur,{peak:gain||0.05,a:0.55,r:0.75,cut:1300,type:'sawtooth'}));
  const brass=(t,tri,dur,gain)=>tri.concat([tri[0]+12]).forEach((s,i)=>voice(t,hz(110,s),dur,{peak:(gain||0.08)/(1+i*0.2),a:0.05,r:0.18,cut:2000,type:'sawtooth',detune:i%2?5:-5}));
  const melo=(t,semi,dur,gain,base)=>voice(t,hz(base||220,semi),dur,{peak:gain||0.16,a:0.06,r:0.2,cut:3000,type:'triangle',vib:6});
  const harp=(t,semi,dur,base)=>voice(t,hz(base||220,semi),dur||0.5,{peak:0.1,a:0.006,r:0.45,cut:3200,type:'triangle'});
  function bassv(t,semi,dur,gain){
    voice(t,hz(55,semi),dur,{peak:gain||0.24,a:0.02,r:0.14,cut:1300,type:'triangle'});
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=hz(55,semi);
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime((gain||0.24)*0.7,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.05);
  }
  function thump(t,gain){const o=ctx.createOscillator();o.type='sine';const g=ctx.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+0.18);g.gain.setValueAtTime(gain||0.6,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.4);}
  function crash(t,gain,dur,hp){const len=Math.floor(ctx.sampleRate*(dur||0.4));const buf=ctx.createBuffer(1,len,ctx.sampleRate);const d=buf.getChannelData(0);for(let k=0;k<len;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/len,1.4);const n=ctx.createBufferSource();n.buffer=buf;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp||3000;const g=ctx.createGain();g.gain.value=gain||0.1;n.connect(f);f.connect(g);g.connect(bus);n.start(t);}

  // ── melodies as bars of [semitone(from base), beatOffset, durBeats] ──
  // Ode to Joy (Beethoven, public domain) — semitones relative to A(220), key of C
  const ODE=[
    [[7,0,1],[7,1,1],[8,2,1],[10,3,1]],
    [[10,0,1],[8,1,1],[7,2,1],[5,3,1]],
    [[3,0,1],[3,1,1],[5,2,1],[7,3,1]],
    [[7,0,1.5],[5,1.5,0.5],[5,2,2]],
    [[7,0,1],[7,1,1],[8,2,1],[10,3,1]],
    [[10,0,1],[8,1,1],[7,2,1],[5,3,1]],
    [[3,0,1],[3,1,1],[5,2,1],[7,3,1]],
    [[5,0,1.5],[3,1.5,0.5],[3,2,2]]
  ];
  // Original heroic line in A minor over Am–F–C–G
  const HERO=[
    [[12,0,2],[15,2,1],[12,3,1]],
    [[17,0,2],[15,2,1],[12,3,1]],
    [[15,0,1],[14,1,1],[12,2,2]],
    [[14,0,1],[12,1,1],[10,2,1],[7,3,1]]
  ];
  const playMel=(t,i,bars,base,gain,spb)=>{const bar=bars[i%bars.length];for(const [s,off,dur] of bar)melo(t+off*spb,s,dur*spb*0.96,gain,base);};

  // ── themes: schedule one full 4/4 bar given start time t and bar index i ──
  const THEMES={
    epic:{bpm:120,beats:4,prog:[['A','min'],['F','maj'],['C','maj'],['G','maj']],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];
        strings(t,tri,spb*4,0.05); brass(t,tri,spb*1.9,0.08); brass(t+spb*2,tri,spb*1.9,0.07);
        for(let e=0;e<8;e++)bassv(t+e*spb/2,rs+(e%2?12:0),spb*0.46,0.24);
        thump(t,0.7);thump(t+spb*2,0.58);thump(t+spb*1.5,0.28);thump(t+spb*3.5,0.32);
        if(i%4===0)crash(t,0.1,0.4,3400);
        playMel(t,i,HERO,220,0.17,spb);}},
    triumph:{bpm:104,beats:4,prog:[['C','maj'],['G','maj'],['C','maj'],['G','maj'],['C','maj'],['G','maj'],['A','min'],['G','maj']],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%this.prog.length],tri=triad(rn,ty),rs=NOTE[rn];
        strings(t,tri,spb*4,0.055); brass(t,tri,spb*3.8,0.055);
        for(let e=0;e<4;e++)bassv(t+e*spb,rs+(e%2?12:0),spb*0.9,0.22);
        thump(t,0.62);thump(t+spb*2,0.5);
        if(i%4===0)crash(t,0.09,0.45,3200);
        playMel(t,i,ODE,220,0.2,spb);}},
    drive:{bpm:148,beats:4,prog:[['A','min'],['G','maj'],['F','maj'],['G','maj']],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];
        strings(t,tri,spb*4,0.04); brass(t,tri,spb*0.9,0.07); brass(t+spb*2,tri,spb*0.9,0.06);
        for(let e=0;e<8;e++)bassv(t+e*spb/2,rs,spb*0.44,0.24);
        for(let b=0;b<4;b++)thump(t+b*spb,b%2?0.4:0.6);
        const m=[12,10,8,7,8,10,12,14];for(let e=0;e<8;e++)melo(t+e*spb/2,m[e],spb*0.42,0.11,220);}},
    ambient:{bpm:60,beats:4,prog:[['A','min'],['A','min'],['F','maj'],['C','maj']],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];
        strings(t,tri,spb*4,0.055); bassv(t,rs,spb*4,0.15);
        const sc=[0,3,7,10,12];if(Math.random()<0.7)harp(t+spb*(1+Math.floor(Math.random()*3)),sc[Math.floor(Math.random()*sc.length)],1.2,220);}},
    calm:{bpm:72,beats:4,prog:[['A','min'],['E','min'],['F','maj'],['C','maj']],
      mel:[7,12,10,8, 7,5,7,null, 8,10,12,null, 7,5,3,null],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];
        strings(t,tri,spb*4,0.05); bassv(t,rs,spb*4,0.16); thump(t,0.24);
        for(let b=0;b<4;b++){const n=this.mel[(i%4)*4+b];if(n!=null)harp(t+b*spb,n,spb*0.9,220);}}},
    mystic:{bpm:76,beats:4,prog:[['F','maj'],['C','maj'],['G','maj'],['A','min']],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];
        strings(t,tri,spb*4,0.05); bassv(t,rs,spb*4,0.15);
        const arp=[tri[0],tri[1],tri[2],tri[1]+12,tri[2],tri[1],tri[0]+12,tri[1]];
        for(let e=0;e<8;e++)harp(t+e*spb/2,arp[e],spb*0.55,220);
        if(i%2===0)melo(t,tri[0]+12,spb*3,0.1,220);}},
    tense:{bpm:80,beats:4,prog:[['A','min'],['A','min'],['A','min'],['A','min']],
      bar(t,i){const spb=60/this.bpm;
        [0,6,7].forEach(s=>voice(t,hz(110,s),spb*4,{peak:0.04,a:0.7,r:0.9,cut:900,type:'sawtooth',detune:6}));
        bassv(t,0,spb*4,0.2); if(i%2===0)thump(t,0.36);
        if(i%4===3)crash(t+spb*3,0.05,0.6,2400);
        if(Math.random()<0.4)melo(t+spb*(1+Math.floor(Math.random()*2)),[1,6,8][Math.floor(Math.random()*3)],spb,0.06,220);}}
  };

  function scheduler(){
    if(!ctx) return;
    while(nextBarTime < ctx.currentTime + 0.25){
      const th=THEMES[current]||THEMES.epic;
      try{ th.bar(nextBarTime, barIx); }catch(e){}
      nextBarTime += (60/th.bpm)*th.beats;
      barIx++;
      if(pending!==current){ current=pending; barIx=0; }   // switch on bar boundary
    }
  }

  return {
    start(){
      if(!ensure()) return;
      if(ctx.state==='suspended') ctx.resume();
      if(!timer){ nextBarTime=ctx.currentTime+0.1; barIx=0; timer=setInterval(scheduler,25); }
    },
    set(name){ if(THEMES[name]){ pending=name; if(!timer) current=name; } },
    toggle(){ muted=!muted; if(master) master.gain.setTargetAtTime(muted?0:0.30, ctx.currentTime, 0.05); if(!muted) this.start(); return muted; },
    isMuted(){ return muted; },
    running(){ return !!(ctx && ctx.state==='running'); }
  };
})();
window.Music=Music;
function toggleMusic(){const m=Music.toggle();const b=document.getElementById('music-btn');b.textContent=m?'🔇':'🔊';b.classList.toggle('muted',m);}
let silentEl=null;
function unlockAudio(){
  if(!silentEl){silentEl=document.createElement('audio');silentEl.setAttribute('playsinline','');silentEl.loop=true;silentEl.volume=0.001;silentEl.src='data:audio/wav;base64,UklGRqQHAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YYAHAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=';}
  silentEl.play().catch(()=>{});
  Music.set('triumph'); Music.start();
  if(Music.running()){['pointerdown','touchstart','touchend','mousedown','click','keydown'].forEach(ev=>document.removeEventListener(ev,unlockAudio));}
}
['pointerdown','touchstart','touchend','mousedown','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio));
</script>
</html>
