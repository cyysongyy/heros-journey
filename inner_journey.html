<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>內在英雄之旅 · The Inner Journey</title>
<style>
:root{--gold:#c9a84c;--gold-light:#e8d48a;--green:#5ac878;--text:#e7e0d0;--muted:rgba(200,180,140,0.62);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#07050f;color:var(--text);font-family:"Noto Serif TC","Songti TC",Georgia,serif;overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;}
.screen.active{display:flex;}
.screen.center{justify-content:center;text-align:center;padding:24px;}
#lang-btn,#music-btn,#home-btn,#fs-btn{position:fixed;top:14px;z-index:1000;background:rgba(0,0,0,.55);border:1px solid var(--gold);color:var(--gold);cursor:pointer;border-radius:3px;font-family:inherit;letter-spacing:1px;text-decoration:none;}
#home-btn{left:14px;padding:6px 12px;font-size:12px;}
#lang-btn{right:14px;padding:6px 14px;font-size:12px;} #music-btn{right:74px;padding:6px 9px;font-size:14px;line-height:1;} #music-btn.muted{opacity:.5;}
#fs-btn{right:114px;padding:6px 9px;font-size:13px;font-weight:700;line-height:1;}
.btn{padding:14px 40px;background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(120,80,200,.2));border:1px solid var(--gold);color:var(--gold-light);font-size:16px;letter-spacing:3px;cursor:pointer;border-radius:3px;font-family:inherit;transition:all .3s;}
.btn:hover{background:linear-gradient(135deg,rgba(201,168,76,.4),rgba(120,80,200,.35));box-shadow:0 0 22px rgba(201,168,76,.3);}
.btn-sm{padding:9px 22px;font-size:13px;letter-spacing:1px;}

/* title */
#title{background:radial-gradient(ellipse at 50% 32%,#141a3a 0,#0a0820 55%,#06040e 100%);}
.t-cover{width:min(190px,46vw);height:min(190px,46vw);object-fit:cover;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 44px rgba(201,168,76,.38),inset 0 0 22px rgba(0,0,0,.6);margin-bottom:22px;animation:tfloat 4s ease-in-out infinite;}
@keyframes tfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.t-zh{font-size:clamp(30px,8vw,46px);color:var(--gold-light);letter-spacing:8px;text-shadow:0 0 24px rgba(201,168,76,.5);}
.t-en{font-size:13px;letter-spacing:5px;color:var(--muted);margin:10px 0 22px;}
.t-sub{font-size:13px;color:var(--muted);line-height:1.9;max-width:520px;margin-bottom:30px;}

/* journey */
#journey{background:radial-gradient(ellipse at 50% 20%,#121834 0,#0a0820 60%,#06040e 100%);justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;opacity:0.5;transition:opacity .6s;}
#veil{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,4,14,0.4) 0%,rgba(6,4,14,0.32) 34%,rgba(6,4,14,0.9) 80%);}
#ringwrap,#body{position:relative;z-index:2;}
#ringwrap{margin-top:26px;flex-shrink:0;}
svg#ring{width:min(250px,66vw);height:auto;display:block;}
#ring .rlabel{fill:var(--muted);font-size:15px;font-family:inherit;font-weight:700;}
#ring .rlabel.active{fill:var(--gold-light);}
#ring .axis{fill:rgba(200,180,140,0.45);font-size:12px;font-family:inherit;}
#ring .center-zh{fill:var(--gold);font-size:20px;font-weight:700;font-family:inherit;letter-spacing:2px;}
#ring .ringpath{fill:none;stroke:rgba(201,168,76,0.35);stroke-width:3;}
#ring .thresh{stroke:rgba(201,168,76,0.30);stroke-width:2;stroke-dasharray:5 5;}
#ring #ring-marker{fill:var(--gold-light);filter:drop-shadow(0 0 6px rgba(232,212,138,.9));}
#ring #ring-marker-pulse{fill:none;stroke:var(--gold-light);opacity:.5;}

#body{width:100%;max-width:640px;margin:0 auto;padding:12px 22px 120px;}
.ph-zone{font-size:11px;letter-spacing:3px;color:var(--gold);text-align:center;}
.ph-title{font-size:clamp(20px,5.5vw,26px);color:var(--gold-light);letter-spacing:2px;text-align:center;margin:2px 0 14px;}
.narr{font-size:clamp(14px,4vw,16px);line-height:1.95;color:#efe8d6;margin-bottom:12px;text-align:center;}
.myth-echo{font-size:12.5px;line-height:1.8;color:#cbb98a;background:rgba(201,168,76,.07);border-left:2px solid var(--gold);padding:9px 13px;border-radius:0 4px 4px 0;margin-bottom:10px;}
.myth-echo .mlabel{display:block;font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:3px;}
.myth-quote{font-style:italic;font-size:13px;color:#e8dcc0;text-align:center;margin-bottom:18px;line-height:1.7;}
.myth-quote .msrc{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:4px;}
.prompt{font-size:14px;color:var(--gold-light);letter-spacing:.5px;margin:6px 0 10px;line-height:1.7;text-align:center;}
textarea{width:100%;min-height:90px;background:rgba(0,0,0,.4);border:1px solid rgba(201,168,76,.4);color:var(--text);font-family:inherit;font-size:15px;line-height:1.7;padding:12px 14px;border-radius:4px;resize:vertical;}
textarea:focus{outline:none;border-color:var(--gold);}
#write-warn{color:#ff8a72;font-size:12px;margin-top:6px;min-height:16px;letter-spacing:.5px;}
.choose-label{font-size:13px;color:var(--muted);margin:16px 0 8px;text-align:center;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{text-align:left;padding:13px 16px;background:rgba(20,16,36,.72);border:1px solid rgba(201,168,76,.32);color:var(--text);border-radius:4px;cursor:pointer;font-family:inherit;font-size:14.5px;line-height:1.6;transition:all .2s;}
.choice:hover{border-color:var(--gold);background:rgba(40,32,64,.8);transform:translateX(3px);}
.choice .tag{display:block;font-size:11px;color:var(--gold);opacity:.85;margin-top:6px;letter-spacing:1px;}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(180deg,transparent,rgba(6,4,14,.92) 45%);padding:12px 18px 14px;display:none;}
#hud.on{display:block;}
.hud-inner{max-width:640px;margin:0 auto;display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);}
.hud-inner b{color:var(--gold-light);}

/* ending */
#ending{background:radial-gradient(ellipse at 50% 25%,#141a3a 0,#0a0820 55%,#06040e 100%);overflow-y:auto;justify-content:flex-start;padding:54px 24px 40px;}
.end-illus{width:130px;height:130px;object-fit:cover;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 40px rgba(201,168,76,.4);margin:0 auto 18px;display:block;}
.arch{font-size:clamp(26px,7vw,36px);color:var(--gold-light);letter-spacing:3px;text-align:center;text-shadow:0 0 24px rgba(201,168,76,.5);margin-bottom:2px;}
.arch-en{font-size:13px;letter-spacing:4px;color:var(--muted);text-align:center;margin-bottom:18px;}
.epic{max-width:600px;font-size:15px;line-height:2.05;color:#efe8d6;white-space:pre-wrap;text-align:center;border-top:1px solid rgba(201,168,76,.25);border-bottom:1px solid rgba(201,168,76,.25);padding:22px 6px;margin-bottom:20px;}
.adv-label{font-size:12px;letter-spacing:4px;color:var(--gold);text-align:center;margin-bottom:12px;}
.advice{max-width:600px;width:100%;display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.advice .line{font-size:14px;line-height:1.7;color:#efe8d6;background:rgba(201,168,76,.07);border-left:2px solid var(--gold);padding:9px 14px;border-radius:0 4px 4px 0;}
</style>

<div id="app">
  <a id="home-btn" href="./index.html" title="選單 / Menu">⌂</a>
  <button id="fs-btn" onclick="cycleFS()" title="文字大小 / Text size">A</button>
  <button id="music-btn" onclick="toggleMusic()" title="音樂 / Music">🔊</button>
  <button id="lang-btn" onclick="toggleLang()">EN</button>

  <section id="title" class="screen center active">
    <img class="t-cover" src="./images/inner_cover.png" alt="" onerror="this.style.display='none'">
    <div class="t-zh" id="tt-zh">內在英雄之旅</div>
    <div class="t-en">THE INNER JOURNEY</div>
    <div class="t-sub" id="tt-sub"></div>
    <button class="btn" onclick="begin()" id="tt-btn">向內啟程 · BEGIN</button>
  </section>

  <section id="journey" class="screen">
    <img id="bg" src="" alt="">
    <div id="veil"></div>
    <div id="ringwrap">
      <svg id="ring" viewBox="0 0 300 300" aria-hidden="true">
        <circle class="ringpath" cx="150" cy="150" r="100"></circle>
        <line class="thresh" x1="50" y1="150" x2="250" y2="150"></line>
        <text class="axis" x="150" y="132" text-anchor="middle" id="ax-known">已知</text>
        <text class="axis" x="150" y="176" text-anchor="middle" id="ax-unknown">未知</text>
        <text class="center-zh" x="150" y="216" text-anchor="middle" id="ring-center">英雄之旅</text>
        <text class="rlabel" id="ring-0" x="226" y="92" text-anchor="middle"></text>
        <text class="rlabel" id="ring-1" x="252" y="154" text-anchor="middle"></text>
        <text class="rlabel" id="ring-2" x="150" y="262" text-anchor="middle"></text>
        <text class="rlabel" id="ring-3" x="48" y="154" text-anchor="middle"></text>
        <text class="rlabel" id="ring-4" x="74" y="92" text-anchor="middle"></text>
        <circle id="ring-marker-pulse" cx="150" cy="50" r="10"></circle>
        <circle id="ring-marker" cx="150" cy="50" r="6"></circle>
      </svg>
    </div>
    <div id="body"></div>
  </section>

  <div id="hud"><div class="hud-inner">
    <span>⚔️ <span id="l-c">勇氣</span> <b id="v-c">10</b></span>
    <span>🌙 <span id="l-w">智慧</span> <b id="v-w">10</b></span>
    <span>❤️ <span id="l-h">心</span> <b id="v-h">10</b></span>
  </div></div>

  <section id="ending" class="screen">
    <img class="end-illus" src="./images/img37.png" alt="" onerror="this.style.display='none'">
    <div class="adv-label" id="e-label">你的內在稱號</div>
    <div class="arch" id="e-arch"></div>
    <div class="arch-en" id="e-arch-en"></div>
    <div class="epic" id="e-epic"></div>
    <div class="adv-label" id="e-adv-label"></div>
    <div class="advice" id="e-advice"></div>
    <div style="margin:26px auto 4px;text-align:center;max-width:600px">
      <div style="font-size:12px;letter-spacing:4px;color:var(--gold);margin-bottom:10px">繼續旅程 · CONTINUE</div>
      <a href="./hall.html" style="display:inline-block;margin:4px 5px;padding:9px 15px;border:1px solid var(--gold);border-radius:4px;color:var(--gold-light);text-decoration:none;font-size:13px;letter-spacing:1px">🏛️ 英雄殿堂 · Hall</a>
      <a href="./odyssey_voyage.html" style="display:inline-block;margin:4px 5px;padding:9px 15px;border:1px solid var(--gold);border-radius:4px;color:var(--gold-light);text-decoration:none;font-size:13px;letter-spacing:1px">⛵ 奧德賽 · 內在航程 · Odyssey</a>
    </div>
    <button class="btn btn-sm" onclick="restart()" id="e-btn">再走一次 · AGAIN</button>
  </section>
</div>

<script>
let LANG='zh';
const UI={
 zh:{sub:'真正的旅程，不是走向遠方，而是走向內心。\n跨越「已知」與「未知」的門檻，遇見、並超越你自己。',begin:'向內啟程 · BEGIN',
   c:'勇氣',w:'智慧',h:'心',choose:'然後，選擇你面對它的方式：',write:'（在這裡寫下你的答案）',needWrite:'請先寫下你的答案，再選擇 ✍️',
   known:'已知',unknown:'未知',center:'英雄之旅',endLabel:'你的內在稱號',advLabel:'給你的建議',again:'再走一次 · AGAIN'},
 en:{sub:'The truest journey goes not outward, but inward.\nCross the threshold of the Known and the Unknown — meet, and surpass, yourself.',begin:'JOURNEY INWARD',
   c:'Courage',w:'Wisdom',h:'Heart',choose:'Then choose how you meet it:',write:'(write your answer here)',needWrite:'Write your answer first, then choose ✍️',
   known:'Known',unknown:'Unknown',center:'The Journey',endLabel:'Your Inner Title',advLabel:'A Word for You',again:'WALK AGAIN'}
};
// five stations of the circle (short ring labels + full titles), mapped to MYTH echoes
const PH=[
 {ring:{zh:'召喚',en:'Call'},myth:1,
  zh:{title:'一 · 召喚（已知）',narr:'你站在熟悉的世界裡，卻聽見一個來自內心深處、微弱卻固執的聲音。',
      prompt:'此刻，你內心深處在呼喚你去面對、或完成什麼？',
      choices:[{t:'一個我一直壓抑的渴望。',a:{heart:2},w:'傾聽渴望'},{t:'一個我逃避已久的問題。',a:{courage:2},w:'直視問題'},{t:'一種想活得更真實的衝動。',a:{wisdom:1,heart:1},w:'嚮往真實'}]},
  en:{title:'I · The Call (Known)',narr:'You stand in the familiar world, yet hear a faint, stubborn voice from deep within.',
      prompt:'Right now, what is your inner self calling you to face or complete?',
      choices:[{t:'A longing I have kept suppressed.',a:{heart:2},w:'hearing the longing'},{t:'A question I have long avoided.',a:{courage:2},w:'facing the question'},{t:'An urge to live more truly.',a:{wisdom:1,heart:1},w:'toward the true'}]}},
 {ring:{zh:'離開',en:'Depart'},myth:4,
  zh:{title:'二 · 離開原地（已知→未知）',narr:'每一次向內的旅程，都要先放下一些「已知」——熟悉的身份、習慣，或安全感。',
      prompt:'你必須放下哪一個「已知」，才能真正啟程？',
      choices:[{t:'放下別人對我的期待。',a:{courage:2},w:'卸下期待'},{t:'放下「我應該沒事」的假裝。',a:{heart:2},w:'誠實面對'},{t:'放下對結果的掌控。',a:{wisdom:2},w:'學會放手'}]},
  en:{title:'II · Departure (Known → Unknown)',narr:'Every inward journey begins by releasing something "known" — a familiar identity, habit, or sense of safety.',
      prompt:'Which "known" must you release to truly set out?',
      choices:[{t:'Others’ expectations of me.',a:{courage:2},w:'shedding expectation'},{t:'The pretense that "I’m fine".',a:{heart:2},w:'honest at last'},{t:'My grip on the outcome.',a:{wisdom:2},w:'learning to release'}]}},
 {ring:{zh:'流浪',en:'Wander'},myth:5,
  zh:{title:'三 · 跨界流浪（未知）',narr:'你踏入了未知。這裡沒有地圖，只有你與你自己。',
      prompt:'在這片未知裡，你遇見了自己的哪一面？（也許是恐懼、脆弱，或從未承認的渴望）',
      choices:[{t:'我的恐懼，比我以為的更巨大。',a:{wisdom:1,heart:1},w:'看見恐懼'},{t:'我的脆弱，也是我的柔軟。',a:{heart:2},w:'接納脆弱'},{t:'我比自己想的更有力量。',a:{courage:2},w:'發現力量'}]},
  en:{title:'III · Wandering the Unknown',narr:'You step into the unknown. There is no map here — only you, and yourself.',
      prompt:'In this unknown, which side of yourself did you meet? (a fear, a softness, an unadmitted longing)',
      choices:[{t:'My fear is larger than I thought.',a:{wisdom:1,heart:1},w:'seeing the fear'},{t:'My fragility is also my tenderness.',a:{heart:2},w:'accepting frailty'},{t:'I am stronger than I believed.',a:{courage:2},w:'finding strength'}]}},
 {ring:{zh:'轉化',en:'Transform'},myth:10,
  zh:{title:'四 · 轉化（未知·最深處）',narr:'在旅程的最深處，舊的你安靜地死去，某樣新的東西開始生長。',
      prompt:'在這最深的地方，你領悟了什麼、或蛻變成了什麼？',
      choices:[{t:'我學會了對自己慈悲。',a:{heart:2},w:'慈悲'},{t:'我看清了什麼才真正重要。',a:{wisdom:2},w:'清明'},{t:'我決定不再向恐懼低頭。',a:{courage:2},w:'無畏'}]},
  en:{title:'IV · Transformation (the deepest point)',narr:'At the journey’s deepest point, the old you quietly dies, and something new begins to grow.',
      prompt:'Here, in the deepest place, what did you realize — or become?',
      choices:[{t:'I learned compassion for myself.',a:{heart:2},w:'compassion'},{t:'I saw what truly matters.',a:{wisdom:2},w:'clarity'},{t:'I chose to bow to fear no more.',a:{courage:2},w:'fearlessness'}]}},
 {ring:{zh:'返回',en:'Return'},myth:11,
  zh:{title:'五 · 返回（未知→已知）',narr:'轉化之後，你必須回到日常——那個「已知」的世界。但你已不是離開時的你。',
      prompt:'你要如何把這份內在的轉化，帶回你的日常生活？',
      choices:[{t:'用更溫柔的方式對待身邊的人。',a:{heart:2},w:'溫柔待人'},{t:'把領悟活成每天的小行動。',a:{wisdom:1,courage:1},w:'落實於日常'},{t:'成為別人黑暗裡的一盞燈。',a:{heart:1,wisdom:1},w:'照亮他人'}]},
  en:{title:'V · Return (Unknown → Known)',narr:'After transformation, you must return to the everyday — the "known" world. But you are no longer who you were.',
      prompt:'How will you carry this inner transformation back into your daily life?',
      choices:[{t:'Treat those around me more gently.',a:{heart:2},w:'gentler with others'},{t:'Live the insight as small daily acts.',a:{wisdom:1,courage:1},w:'made daily'},{t:'Be a lamp in someone’s darkness.',a:{heart:1,wisdom:1},w:'lighting others'}]}}
];
const ANGLES=[50,90,180,270,310];
// per-station background illustrations: dedicated art, falling back to existing scene images
const BG=['./images/inner1_call.png','./images/inner2_depart.png','./images/inner3_wander.png','./images/inner4_transform.png','./images/inner5_return.png'];
const BGFB=['./images/img4.jpg','./images/img7.png','./images/img8.jpg','./images/img13.jpg','./images/img14.png'];

const G={i:0,attrs:{courage:10,wisdom:10,heart:10},answers:[],traits:[]};
const L=()=>LANG,$=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(20,v));

function applyLang(){
  const u=UI[LANG];
  $('lang-btn').textContent=LANG==='zh'?'EN':'中';
  $('tt-zh').textContent=LANG==='zh'?'內在英雄之旅':'The Inner Journey';
  $('tt-sub').textContent=u.sub;$('tt-btn').textContent=u.begin;
  $('l-c').textContent=u.c;$('l-w').textContent=u.w;$('l-h').textContent=u.h;
  $('ax-known').textContent=u.known;$('ax-unknown').textContent=u.unknown;$('ring-center').textContent=u.center;
  $('e-label').textContent=u.endLabel;$('e-btn').textContent=u.again;
  for(let k=0;k<5;k++)$('ring-'+k).textContent=PH[k].ring[LANG==='zh'?'zh':'en'];
}
function toggleLang(){LANG=LANG==='zh'?'en':'zh';applyLang();
  if($('journey').classList.contains('active'))renderPhase(true);}
let FS=+(localStorage.getItem('hj_fs')||1);if(![1,2,3].includes(FS))FS=1;
const FS_Z={1:1,2:1.18,3:1.36},FS_L={1:'A',2:'A+',3:'A++'};
function applyFS(){const b=$('body');if(b)b.style.zoom=FS_Z[FS];const btn=$('fs-btn');if(btn)btn.textContent=FS_L[FS];}
function cycleFS(){FS=FS>=3?1:FS+1;try{localStorage.setItem('hj_fs',FS);}catch(e){}applyFS();}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');
  const th={title:'mystic',journey:'mystic',ending:'triumph'};if(th[id]&&window.Music)Music.set(th[id]);}
function begin(){G.i=0;G.attrs={courage:10,wisdom:10,heart:10};G.answers=[];G.traits=[];show('journey');$('hud').classList.add('on');renderPhase();}
function restart(){$('hud').classList.remove('on');show('title');}

function updateHUD(){$('v-c').textContent=G.attrs.courage;$('v-w').textContent=G.attrs.wisdom;$('v-h').textContent=G.attrs.heart;}
function moveMarker(i){
  const a=ANGLES[i]*Math.PI/180, cx=150+100*Math.sin(a), cy=150-100*Math.cos(a);
  $('ring-marker').setAttribute('cx',cx.toFixed(1));$('ring-marker').setAttribute('cy',cy.toFixed(1));
  $('ring-marker-pulse').setAttribute('cx',cx.toFixed(1));$('ring-marker-pulse').setAttribute('cy',cy.toFixed(1));
  for(let k=0;k<5;k++)$('ring-'+k).classList.toggle('active',k===i);
}
function renderPhase(keep){
  const p=PH[G.i],d=p[L()],u=UI[LANG];
  const bg=$('bg'); bg.onload=function(){this.style.opacity=0.5;}; bg.onerror=function(){this.onerror=function(){this.onerror=null;this.style.opacity=0;};this.src=BGFB[G.i];}; bg.src=BG[G.i];
  moveMarker(G.i);updateHUD();
  const prev=keep?($('answer')?$('answer').value:''):'';
  const body=$('body');body.innerHTML='';
  const zone=document.createElement('div');zone.className='ph-zone';zone.textContent=(LANG==='zh'?'第 ':'Station ')+(G.i+1)+' / 5';body.appendChild(zone);
  const tt=document.createElement('div');tt.className='ph-title';tt.textContent=d.title;body.appendChild(tt);

// ═══ music (shared engine) ═══
const Music = (function(){
  let ctx=null, master=null, bus=null, timer=null;
  let muted=false, nextBarTime=0, barIx=0;
  let current='epic', pending='epic';
  const NOTE={A:0,'A#':1,B:2,C:3,'C#':4,D:5,'D#':6,E:7,F:8,'F#':9,G:10,'G#':11};
  const hz=(root,s)=>root*Math.pow(2,s/12);
  const triad=(name,type)=>{const r=NOTE[name],t=type==='min'?3:4;return [r,r+t,r+7];};

  function impulse(sec,decay){
    const rate=ctx.sampleRate,len=Math.floor(rate*sec),buf=ctx.createBuffer(2,len,rate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    return buf;
  }
  function ensure(){
    if(ctx) return true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:0.30;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=3; comp.attack.value=0.006; comp.release.value=0.3;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200;
    master.connect(comp); comp.connect(lp); lp.connect(ctx.destination);
    // instrument bus -> dry + reverb (lush hall for an epic, less "raw" sound)
    bus=ctx.createGain(); bus.connect(master);
    const rev=ctx.createConvolver(); rev.buffer=impulse(2.8,2.2);
    const wet=ctx.createGain(); wet.gain.value=0.85;
    bus.connect(rev); rev.connect(wet); wet.connect(master);
    return true;
  }

  // ── warm layered voice: two slightly-detuned oscillators through a lowpass,
  //    smooth ADSR, optional gentle vibrato — far softer than a bare sawtooth ──
  function voice(t,freq,dur,o){
    o=o||{};
    const peak=o.peak!=null?o.peak:0.14,a=o.a!=null?o.a:0.04,r=o.r!=null?o.r:0.25;
    const cut=o.cut||2600,type=o.type||'sawtooth';
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.setValueAtTime(peak,t+Math.max(a+0.005,dur-r));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut;
    f.connect(g); g.connect(bus);
    const base=o.detune||0;
    const mk=(det)=>{const os=ctx.createOscillator();os.type=type;os.frequency.value=freq;os.detune.value=det;os.connect(f);os.start(t);os.stop(t+dur+0.06);return os;};
    const o1=mk(base-6),o2=mk(base+6);
    if(o.vib){const vo=ctx.createOscillator();vo.type='sine';vo.frequency.value=5.2;const vg=ctx.createGain();vg.gain.value=o.vib;vo.connect(vg);vg.connect(o1.detune);vg.connect(o2.detune);vo.start(t);vo.stop(t+dur+0.06);}

  const brass=(t,tri,dur,gain)=>tri.concat([tri[0]+12]).forEach((s,i)=>voice(t,hz(110,s),dur,{peak:(gain||0.08)/(1+i*0.2),a:0.05,r:0.18,cut:2000,type:'sawtooth',detune:i%2?5:-5}));

  const harp=(t,semi,dur,base)=>voice(t,hz(base||220,semi),dur||0.5,{peak:0.1,a:0.006,r:0.45,cut:3200,type:'triangle'});
  function bassv(t,semi,dur,gain){
    voice(t,hz(55,semi),dur,{peak:gain||0.24,a:0.02,r:0.14,cut:1300,type:'triangle'});

    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime((gain||0.24)*0.7,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

  // ── melodies as bars of [semitone(from base), beatOffset, durBeats] ──
  // Ode to Joy (Beethoven, public domain) — semitones relative to A(220), key of C

    [[7,0,1],[7,1,1],[8,2,1],[10,3,1]],
    [[10,0,1],[8,1,1],[7,2,1],[5,3,1]],
    [[3,0,1],[3,1,1],[5,2,1],[7,3,1]],
    [[7,0,1.5],[5,1.5,0.5],[5,2,2]],
    [[7,0,1],[7,1,1],[8,2,1],[10,3,1]],
    [[10,0,1],[8,1,1],[7,2,1],[5,3,1]],
    [[3,0,1],[3,1,1],[5,2,1],[7,3,1]],
    [[5,0,1.5],[3,1.5,0.5],[3,2,2]]

    [[12,0,2],[15,2,1],[12,3,1]],
    [[17,0,2],[15,2,1],[12,3,1]],

      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%this.prog.length],tri=triad(rn,ty),rs=NOTE[rn];

    drive:{bpm:148,beats:4,prog:[['A','min'],['G','maj'],['F','maj'],['G','maj']],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];

        const m=[12,10,8,7,8,10,12,14];for(let e=0;e<8;e++)melo(t+e*spb/2,m[e],spb*0.42,0.11,220);}},
    ambient:{bpm:60,beats:4,prog:[['A','min'],['A','min'],['F','maj'],['C','maj']],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];

        const sc=[0,3,7,10,12];if(Math.random()<0.7)harp(t+spb*(1+Math.floor(Math.random()*3)),sc[Math.floor(Math.random()*sc.length)],1.2,220);}},
    calm:{bpm:72,beats:4,prog:[['A','min'],['E','min'],['F','maj'],['C','maj']],
      mel:[7,12,10,8, 7,5,7,null, 8,10,12,null, 7,5,3,null],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];

      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];
        strings(t,tri,spb*4,0.05); bassv(t,rs,spb*4,0.15);

  };
})();
