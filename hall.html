<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英雄殿堂 · Hall of Heroes</title>
<style>
:root{--gold:#c9a84c;--gold-light:#e8d48a;--green:#5ac878;--text:#e7e0d0;--muted:rgba(200,180,140,0.62);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{background:#07050f;color:var(--text);font-family:"Noto Serif TC","Songti TC",Georgia,serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 18%,#1b1240 0%,#0a0820 55%,#06040e 100%);}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.34;transition:opacity .6s;}
#home-btn,#lang-btn,#music-btn,#fs-btn{position:fixed;top:14px;z-index:1000;background:rgba(0,0,0,.55);border:1px solid var(--gold);color:var(--gold);cursor:pointer;border-radius:3px;font-family:inherit;letter-spacing:1px;text-decoration:none;}
#home-btn{left:14px;padding:6px 12px;font-size:12px;}
#lang-btn{right:14px;padding:6px 14px;font-size:12px;} #music-btn{right:74px;padding:6px 9px;font-size:14px;line-height:1;} #music-btn.muted{opacity:.5;}
#fs-btn{right:114px;padding:6px 9px;font-size:13px;font-weight:700;line-height:1;}
.screen{display:none;position:relative;z-index:2;}
.screen.active{display:block;}
.wrap{max-width:640px;margin:0 auto;padding:56px 22px 60px;}
.center{text-align:center;}
.btn{padding:14px 40px;background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(120,90,200,.2));border:1px solid var(--gold);color:var(--gold-light);font-size:16px;letter-spacing:3px;cursor:pointer;border-radius:3px;font-family:inherit;transition:all .3s;}
.btn:hover{background:linear-gradient(135deg,rgba(201,168,76,.4),rgba(120,90,200,.35));box-shadow:0 0 22px rgba(201,168,76,.3);}
.btn-sm{padding:9px 22px;font-size:13px;letter-spacing:1px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
/* title */
#title .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.hero{width:min(150px,40vw);height:min(150px,40vw);border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 44px rgba(201,168,76,.35);margin-bottom:20px;}
.t-zh{font-size:clamp(30px,8vw,46px);color:var(--gold-light);letter-spacing:8px;text-shadow:0 0 24px rgba(201,168,76,.5);}
.t-en{font-size:13px;letter-spacing:5px;color:var(--muted);margin:10px 0 20px;}
.t-sub{font-size:13.5px;color:var(--muted);line-height:1.9;max-width:460px;margin-bottom:28px;white-space:pre-line;}
/* hall */
.hall-head{text-align:center;margin-bottom:8px;}
.hall-title{font-size:clamp(22px,6vw,30px);color:var(--gold-light);letter-spacing:3px;}
.hall-prog{font-size:12.5px;color:var(--muted);letter-spacing:2px;margin:8px 0 22px;text-align:center;}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.gate{position:relative;background:rgba(20,16,36,.72);border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:18px 16px;cursor:pointer;transition:all .22s;text-align:center;overflow:hidden;}
.gate:hover{border-color:var(--gold);background:rgba(44,34,70,.85);transform:translateY(-2px);}
.gate.done{border-color:var(--green);box-shadow:0 0 22px rgba(90,200,120,.22);}
.gate .ic{font-size:34px;line-height:1;filter:drop-shadow(0 0 10px rgba(201,168,76,.4));}
.gate .gn{font-size:16px;color:var(--gold-light);letter-spacing:1px;margin-top:8px;}
.gate .gs{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:1px;}
.gate .mark{position:absolute;top:8px;right:10px;font-size:15px;}
.gate.done .gn{color:var(--green);}
.claim-wrap{text-align:center;margin-top:26px;}
/* trial */
.tr-zone{font-size:11px;letter-spacing:3px;color:var(--gold);text-align:center;}
.tr-title{font-size:clamp(19px,5vw,24px);color:var(--gold-light);letter-spacing:1px;text-align:center;margin:3px 0 14px;}
.narr{font-size:clamp(14px,4vw,16px);line-height:1.95;color:#efe8d6;margin-bottom:12px;text-align:center;}
.myth-echo{font-size:12.5px;line-height:1.8;color:#cbb98a;background:rgba(201,168,76,.07);border-left:2px solid var(--gold);padding:9px 13px;border-radius:0 4px 4px 0;margin-bottom:10px;}
.myth-echo .mlabel{display:block;font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:3px;}
.myth-quote{font-style:italic;font-size:13px;color:#e8dcc0;text-align:center;margin-bottom:16px;line-height:1.7;}
.myth-quote .msrc{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:4px;}
.prompt{font-size:14px;color:var(--gold-light);letter-spacing:.5px;margin:6px 0 10px;line-height:1.7;text-align:center;}
textarea{width:100%;min-height:84px;background:rgba(0,0,0,.4);border:1px solid rgba(201,168,76,.4);color:var(--text);font-family:inherit;font-size:15px;line-height:1.7;padding:12px 14px;border-radius:4px;resize:vertical;}
textarea:focus{outline:none;border-color:var(--gold);}
#write-warn{color:#ff8a72;font-size:12px;margin-top:6px;min-height:16px;letter-spacing:.5px;text-align:center;}
.choose-label{font-size:13px;color:var(--muted);margin:16px 0 8px;text-align:center;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{text-align:left;padding:13px 16px;background:rgba(20,16,36,.72);border:1px solid rgba(201,168,76,.32);color:var(--text);border-radius:4px;cursor:pointer;font-family:inherit;font-size:14.5px;line-height:1.6;transition:all .2s;}
.choice:hover{border-color:var(--gold);background:rgba(44,34,70,.85);transform:translateX(3px);}
.choice .tag{display:block;font-size:11px;color:var(--gold);opacity:.85;margin-top:6px;letter-spacing:1px;}
/* combat */
.foe{text-align:center;margin-bottom:6px;}
.foe .fic{font-size:44px;}
.bar{height:12px;background:rgba(0,0,0,.5);border:1px solid rgba(201,168,76,.35);border-radius:7px;overflow:hidden;margin:8px auto;max-width:280px;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#c0433a,#e0705a);transition:width .3s;}
.hpnum{font-size:12px;color:var(--muted);text-align:center;}
.intent{font-size:13px;color:#e8c07a;text-align:center;margin:10px 0;letter-spacing:.5px;}
.cbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.cbtn{padding:12px 16px;background:rgba(20,16,36,.8);border:1px solid rgba(201,168,76,.4);color:var(--text);border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px;min-width:96px;transition:all .2s;}
.cbtn:hover{border-color:var(--gold);background:rgba(44,34,70,.9);}
.clog{font-size:13px;color:#d8cba6;text-align:center;line-height:1.8;margin-top:14px;min-height:24px;}
/* cards */
.cards3{display:flex;flex-direction:column;gap:10px;}
.tcard{text-align:left;padding:13px 16px;background:rgba(20,16,36,.78);border:1px solid rgba(201,168,76,.4);border-radius:8px;cursor:pointer;font-family:inherit;color:var(--text);transition:all .2s;}
.tcard:hover{border-color:var(--gold);transform:translateY(-2px);background:rgba(44,34,70,.9);}
.tcard .cn{font-size:15px;color:var(--gold-light);letter-spacing:1px;}
.tcard .cd{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6;}
/* result */
.result{text-align:center;}
.result .rlead{font-size:15px;color:#efe8d6;line-height:1.9;margin:10px 0 16px;}
.gainrow{font-size:13px;color:var(--gold-light);letter-spacing:1px;margin-bottom:18px;}
.link-full{display:inline-block;margin:4px 6px;padding:9px 18px;border:1px solid var(--gold);border-radius:4px;color:var(--gold-light);text-decoration:none;font-size:13px;letter-spacing:1px;transition:all .2s;}
.link-full:hover{background:rgba(201,168,76,.18);}
/* hud */
#hud{position:fixed;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(180deg,transparent,rgba(6,4,14,.92) 45%);padding:12px 18px 14px;display:none;}
#hud.on{display:block;}
.hud-inner{max-width:640px;margin:0 auto;display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);}
.hud-inner b{color:var(--gold-light);}
/* ending */
.arch{font-size:clamp(24px,6.5vw,34px);color:var(--gold-light);letter-spacing:2px;text-align:center;text-shadow:0 0 24px rgba(201,168,76,.5);margin-bottom:2px;}
.arch-en{font-size:13px;letter-spacing:4px;color:var(--muted);text-align:center;margin-bottom:18px;}
.medal{width:120px;height:120px;object-fit:cover;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 40px rgba(201,168,76,.4);margin:0 auto 18px;display:block;}
.epic{max-width:600px;font-size:15px;line-height:2.05;color:#efe8d6;white-space:pre-wrap;text-align:center;border-top:1px solid rgba(201,168,76,.25);border-bottom:1px solid rgba(201,168,76,.25);padding:22px 6px;margin:0 auto 20px;}
.adv-label{font-size:12px;letter-spacing:4px;color:var(--gold);text-align:center;margin:6px 0 12px;}
.advice{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.advice .line{font-size:14px;line-height:1.7;color:#efe8d6;background:rgba(201,168,76,.07);border-left:2px solid var(--gold);padding:9px 14px;border-radius:0 4px 4px 0;}
.rec{max-width:600px;margin:0 auto 20px;text-align:center;}
.rec .rec-primary{font-size:15px;color:#efe8d6;line-height:1.8;margin-bottom:12px;}
.rec .rec-primary b{color:var(--gold-light);}
.all-links{text-align:center;line-height:2.4;}
</style>

<div id="bg"><img src="./images/hall_bg.png" alt="" onerror="this.onerror=function(){this.style.display='none';};this.src='./images/img0.png';"></div>

</div></div>

<section id="ending" class="screen">

    <div class="adv-label" id="e-adv-label"></div>
    <div class="advice" id="e-advice"></div>
    <div class="adv-label" id="e-rec-label"></div>

    <div class="center" style="margin-top:24px"><button class="btn btn-sm" onclick="restart()" id="e-btn">再進殿堂 · AGAIN</button></div>
  </div>
</section>

function renderHall(){
 const u=UI[LANG],g=$('gates');g.innerHTML='';
 GATES.forEach(gt=>{const d=gt[LANG],done=!!G.done[gt.id];
  const el=document.createElement('div');el.className='gate'+(done?' done':'');
  el.innerHTML=`<span class="mark">${done?'✅':'✦'}</span><div class="ic">${gt.icon}</div><div class="gn">${d.name}</div><div class="gs">${done?u.done:d.gs}</div>`;

function openGate(id,keep){

 $('trial').dataset.gate=id;show('trial');$('hud').classList.add('on');
 const body=$('trial-body');const prev=keep?($('answer')?$('answer').value:''):'';
 body.innerHTML='';
 const t=gt.t[LANG];
 const zone=document.createElement('div');zone.className='tr-zone';zone.textContent=gt.icon+' '+gt[LANG].name;body.appendChild(zone);
 const tt=document.createElement('div');tt.className='tr-title';tt.textContent=t.title;body.appendChild(tt);
 if(gt.type==='combat'){renderCombat(gt,body);return;}
 if(gt.type==='deck'){renderDeck(gt,body);return;}
 // myth / reflect
 const narr=document.createElement('div');narr.className='narr';narr.textContent=t.n;body.appendChild(narr);
 if(t.e){const echo=document.createElement('div');echo.className='myth-echo';echo.innerHTML=`<span class="mlabel">🏛️ ${LANG==='zh'?'神話回聲':'MYTHIC ECHO'}</span>${t.e}`;body.appendChild(echo);}
 if(t.q){const mq=document.createElement('div');mq.className='myth-quote';mq.innerHTML=`${t.q}<span class="msrc">— ${t.s}</span>`;body.appendChild(mq);}
 const pr=document.createElement('div');pr.className='prompt';pr.textContent=t.pr;body.appendChild(pr);
 let ta=null;
 if(gt.type==='reflect'){
  ta=document.createElement('textarea');ta.id='answer';ta.placeholder=UI[LANG].write;ta.value=prev;
  ta.addEventListener('input',()=>{ta.style.borderColor='';$('write-warn').textContent='';});body.appendChild(ta);
  const warn=document.createElement('div');warn.id='write-warn';body.appendChild(warn);
 }
 const cl=document.createElement('div');cl.className='choose-label';cl.textContent=UI[LANG].choose;body.appendChild(cl);
 const cw=document.createElement('div');cw.className='choices';
 t.ch.forEach((c,idx)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`${c.t}<span class="tag">✦ ${c.w}</span>`;
  b.onclick=()=>{if(gt.type==='reflect'){const ans=(ta.value||'').trim();if(!ans){$('write-warn').textContent=UI[LANG].needWrite;ta.style.borderColor='#e0503a';ta.focus();return;}G.answers.push(ans);}
   G.traits.push(c.w);applyGain(c.a);completeGate(gt,c.a);};cw.appendChild(b);});
 body.appendChild(cw);
 backBtn(body);
}

function renderCombat(gt,body){
 const t=gt.t[LANG];
 const narr=document.createElement('div');narr.className='narr';narr.textContent=t.n;body.appendChild(narr);
 const foe=document.createElement('div');foe.className='foe';foe.innerHTML=`<div class="fic">${t.fic}</div><div style="color:var(--gold-light);letter-spacing:1px">${t.foe}</div>`;body.appendChild(foe);
 const barwrap=document.createElement('div');barwrap.className='bar';barwrap.innerHTML='<i id="foe-hp" style="width:100%"></i>';body.appendChild(barwrap);
 const hpn=document.createElement('div');hpn.className='hpnum';hpn.id='foe-hpn';body.appendChild(hpn);
 const intent=document.createElement('div');intent.className='intent';intent.id='intent';body.appendChild(intent);
 const cb=document.createElement('div');cb.className='cbtns';
 const opts=LANG==='zh'?[['strike','⚔️ 斬擊'],['insight','🌙 洞見'],['ward','❤️ 守心']]:[['strike','⚔️ Strike'],['insight','🌙 Insight'],['ward','❤️ Ward']];
 opts.forEach(([k,label])=>{const b=document.createElement('button');b.className='cbtn';b.textContent=label;b.onclick=()=>combatTurn(gt,k);cb.appendChild(b);});
 body.appendChild(cb);
 const log=document.createElement('div');log.className='clog';log.id='clog';body.appendChild(log);
 backBtn(body);
 CB={hp:26,max:26,round:0,intents:LANG==='zh'?['蓄力重擊','低語惑心','猛撲']:['a heavy blow','a whisper of doubt','a lunge']};
 nextIntent();renderFoe();
}
let CB=null;
function renderFoe(){const p=Math.max(0,CB.hp/CB.max*100);$('foe-hp').style.width=p+'%';$('foe-hpn').textContent=`HP ${Math.max(0,CB.hp)} / ${CB.max}`;}
function nextIntent(){CB.curIntent=CB.intents[CB.round%CB.intents.length];$('intent').textContent=(LANG==='zh'?'敵人意圖：':'Intent: ')+CB.curIntent;}
function combatTurn(gt,k){
 if(!CB||CB.over)return;
 let dmg=0,gain={},msg='';
 if(k==='strike'){dmg=9;gain={courage:2};msg=LANG==='zh'?'你斬出勇氣的一擊！':'You strike with courage!';}
 else if(k==='insight'){dmg=13;gain={wisdom:2};msg=LANG==='zh'?'你看破弱點，重創心魔！':'You pierce its weakness!';}
 else{dmg=5;gain={heart:2};msg=LANG==='zh'?'你守住了心，穩住陣腳。':'You guard your heart and hold firm.';}
 CB.hp-=dmg;applyGain(gain);renderFoe();
 $('clog').textContent=msg;
 CB.round++;
 if(CB.hp<=0){
  CB.over=true;
  $('clog').textContent=(LANG==='zh'?'心魔潰散——這道門，點亮了。':'The demon scatters — the gate is lit.');
  G.traits.push(LANG==='zh'?'戰勝':'triumph');
  setTimeout(()=>{if(G.done[gt.id])return;completeGate(gt,{},true);},650);return;
 }
 if(CB.round>=4){ // safety: after some rounds, resolve
  CB.over=true;
  $('clog').textContent=(LANG==='zh'?'你撐過了它的猛攻，心魔退散。':'You endure its assault; the demon retreats.');
  setTimeout(()=>{if(G.done[gt.id])return;completeGate(gt,{heart:1},true);},650);return;
 }
 nextIntent();
}

function archetype(){
 const {courage:c,wisdom:w,heart:h}=G.attrs,mx=Math.max(c,w,h),spread=mx-Math.min(c,w,h);
 if(spread<=2)return{zh:'圓滿的英雄',en:'The Whole Hero',dz:'勇氣、智慧與心在你之內合而為一。你走過了每一道門，也走成了完整的自己。',de:'Courage, wisdom and heart made one within you. You passed every gate — and became whole.'};
 if(c===mx)return{zh:'不屈的勇者',en:'The Unyielding',dz:'你以勇氣點亮每一道門。真正的英雄，是明知會痛仍向前的人。',de:'You lit every gate with courage. The true hero moves forward knowing it will hurt.'};
 if(w===mx)return{zh:'洞察的智者',en:'The Discerning',dz:'你以智慧看穿每一道門後的真相。看清，本身就是一種勇敢。',de:'You saw the truth behind every gate. To see clearly is itself a kind of courage.'};
 return{zh:'慈悲的守護者',en:'The Compassionate',dz:'你以心走過每一道門。最強的英雄，往往最溫柔。',de:'You walked every gate with heart. The strongest hero is often the gentlest.'};
}
function forgeEpic(){
 const a=G.answers,zh=LANG==='zh',t=s=>{s=(s||'').trim();return s.length>30?s.slice(0,28)+'…':s;};
 const arch=archetype(),o=[];
 if(zh){
  o.push('你走進殿堂，點亮了六道門。');o.push('');
  if(a[0])o.push(`門檻前，你說：「${t(a[0])}」`);
  if(a[1])o.push(`鏡中，你對自己說：「${t(a[1])}」`);
  if(a[2])o.push(`為了所重視的，你願意：「${t(a[2])}」`);
  if(G.traits.length)o.push(`你留下的印記：${G.traits.slice(0,5).join('、')}。`);
  o.push('');o.push('於是殿堂為你命名——');o.push(`「${arch.zh}」。`);o.push(arch.dz);
 }else{
  o.push('You entered the Hall and lit all six gates.');o.push('');
  if(a[0])o.push(`At the threshold you said: "${t(a[0])}"`);
  if(a[1])o.push(`To the mirror you said: "${t(a[1])}"`);
  if(a[2])o.push(`For what mattered, you chose: "${t(a[2])}"`);
  if(G.traits.length)o.push(`Marks you left: ${G.traits.slice(0,5).join(', ')}.`);
  o.push('');o.push('And so the Hall names you —');o.push(`"${arch.en}".`);o.push(arch.de);
 }
 return{arch,text:o.join('\n')};
}
function buildAdvice(){
 const zh=LANG==='zh',out=[],{courage:c,wisdom:w,heart:h}=G.attrs;
 const mx=Math.max(c,w,h),mn=Math.min(c,w,h);
 const nm=v=>zh?(v===c?'勇氣':v===w?'智慧':'心'):(v===c?'courage':v===w?'wisdom':'heart');
 if(G.answers[0])out.push(zh?`你在門檻前說的話，就是你此刻真正的召喚——別讓它只停在心裡。`:`What you said at the threshold is your real call right now — don’t leave it only in your head.`);
 out.push(zh?`你的「${nm(mx)}」帶你點亮了殿堂；也記得溫柔地餵養你的「${nm(mn)}」。`:`Your ${nm(mx)} lit the Hall — remember to nourish your ${nm(mn)} too.`);
 out.push(zh?`六道門是同一個英雄的六個面向。走完一種，再走下一種，你會越來越完整。`:`The six gates are six faces of one hero. Finish one path, then the next — you grow more whole each time.`);
 return out;
}

// ═══ music (shared engine) ═══
const Music = (function(){
  let ctx=null, master=null, bus=null, timer=null;
  let muted=false, nextBarTime=0, barIx=0;
  let current='epic', pending='epic';
  const NOTE={A:0,'A#':1,B:2,C:3,'C#':4,D:5,'D#':6,E:7,F:8,'F#':9,G:10,'G#':11};
  const hz=(root,s)=>root*Math.pow(2,s/12);
  const triad=(name,type)=>{const r=NOTE[name],t=type==='min'?3:4;return [r,r+t,r+7];};

  function impulse(sec,decay){
    const rate=ctx.sampleRate,len=Math.floor(rate*sec),buf=ctx.createBuffer(2,len,rate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    return buf;
  }
  function ensure(){
    if(ctx) return true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:0.30;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=3; comp.attack.value=0.006; comp.release.value=0.3;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200;
    master.connect(comp); comp.connect(lp); lp.connect(ctx.destination);
    // instrument bus -> dry + reverb (lush hall for an epic, less "raw" sound)
    bus=ctx.createGain(); bus.connect(master);
    const rev=ctx.createConvolver(); rev.buffer=impulse(2.8,2.2);
    const wet=ctx.createGain(); wet.gain.value=0.85;
    bus.connect(rev); rev.connect(wet); wet.connect(master);
    return true;
  }

  // ── warm layered voice: two slightly-detuned oscillators through a lowpass,
  //    smooth ADSR, optional gentle vibrato — far softer than a bare sawtooth ──
  function voice(t,freq,dur,o){
    o=o||{};
    const peak=o.peak!=null?o.peak:0.14,a=o.a!=null?o.a:0.04,r=o.r!=null?o.r:0.25;
    const cut=o.cut||2600,type=o.type||'sawtooth';
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.setValueAtTime(peak,t+Math.max(a+0.005,dur-r));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut;
    f.connect(g); g.connect(bus);
    const base=o.detune||0;
    const mk=(det)=>{const os=ctx.createOscillator();os.type=type;os.frequency.value=freq;os.detune.value=det;os.connect(f);os.start(t);os.stop(t+dur+0.06);return os;};
    const o1=mk(base-6),o2=mk(base+6);
    if(o.vib){const vo=ctx.createOscillator();vo.type='sine';vo.frequency.value=5.2;const vg=ctx.createGain();vg.gain.value=o.vib;vo.connect(vg);vg.connect(o1.detune);vg.connect(o2.detune);vo.start(t);vo.stop(t+dur+0.06);}
  }
  const strings=(t,tri,dur,gain)=>tri.concat([tri[0]+12]).forEach(s=>voice(t,hz(110,s),dur,{peak:gain||0.05,a:0.55,r:0.75,cut:1300,type:'sawtooth'}));
  const brass=(t,tri,dur,gain)=>tri.concat([tri[0]+12]).forEach((s,i)=>voice(t,hz(110,s),dur,{peak:(gain||0.08)/(1+i*0.2),a:0.05,r:0.18,cut:2000,type:'sawtooth',detune:i%2?5:-5}));
  const melo=(t,semi,dur,gain,base)=>voice(t,hz(base||220,semi),dur,{peak:gain||0.16,a:0.06,r:0.2,cut:3000,type:'triangle',vib:6});
  const harp=(t,semi,dur,base)=>voice(t,hz(base||220,semi),dur||0.5,{peak:0.1,a:0.006,r:0.45,cut:3200,type:'triangle'});
  function bassv(t,semi,dur,gain){
    voice(t,hz(55,semi),dur,{peak:gain||0.24,a:0.02,r:0.14,cut:1300,type:'triangle'});
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=hz(55,semi);
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime((gain||0.24)*0.7,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.05);
  }
  function thump(t,gain){const o=ctx.createOscillator();o.type='sine';const g=ctx.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+0.18);g.gain.setValueAtTime(gain||0.6,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.4);}
  function crash(t,gain,dur,hp){const len=Math.floor(ctx.sampleRate*(dur||0.4));const buf=ctx.createBuffer(1,len,ctx.sampleRate);const d=buf.getChannelData(0);for(let k=0;k<len;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/len,1.4);const n=ctx.createBufferSource();n.buffer=buf;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp||3000;const g=ctx.createGain();g.gain.value=gain||0.1;n.connect(f);f.connect(g);g.connect(bus);n.start(t);}

  // ── melodies as bars of [semitone(from base), beatOffset, durBeats] ──
  // Ode to Joy (Beethoven, public domain) — semitones relative to A(220), key of C
  const ODE=[
    [[7,0,1],[7,1,1],[8,2,1],[10,3,1]],
    [[10,0,1],[8,1,1],[7,2,1],[5,3,1]],
    [[3,0,1],[3,1,1],[5,2,1],[7,3,1]],
    [[7,0,1.5],[5,1.5,0.5],[5,2,2]],
    [[7,0,1],[7,1,1],[8,2,1],[10,3,1]],
    [[10,0,1],[8,1,1],[7,2,1],[5,3,1]],
    [[3,0,1],[3,1,1],[5,2,1],[7,3,1]],
    [[5,0,1.5],[3,1.5,0.5],[3,2,2]]
  ];
  // Original heroic line in A minor over Am–F–C–G
  const HERO=[
    [[12,0,2],[15,2,1],[12,3,1]],
    [[17,0,2],[15,2,1],[12,3,1]],
    [[15,0,1],[14,1,1],[12,2,2]],
    [[14,0,1],[12,1,1],[10,2,1],[7,3,1]]
  ];
  const playMel=(t,i,bars,base,gain,spb)=>{const bar=bars[i%bars.length];for(const [s,off,dur] of bar)melo(t+off*spb,s,dur*spb*0.96,gain,base);};

  // ── themes: schedule one full 4/4 bar given start time t and bar index i ──
  const THEMES={
    epic:{bpm:120,beats:4,prog:[['A','min'],['F','maj'],['C','maj'],['G','maj']],
      bar(t,i){const spb=60/this.bpm,[rn,ty]=this.prog[i%4],tri=triad(rn,ty),rs=NOTE[rn];
        strings(t,tri,spb*4,0.05); brass(t,tri,spb*1.9,0.08); brass(t+spb*2,tri,spb*1.9,0.07);
        for(let e=0;e<8;e++)bassv(t+e*spb/2,rs+(e%2?12:0),spb*0.46,0.24);

  function scheduler(){
    if(!ctx) return;
    while(nextBarTime < ctx.currentTime + 0.25){
      const th=THEMES[current]||THEMES.epic;
      try{ th.bar(nextBarTime, barIx); }catch(e){}
      nextBarTime += (60/th.bpm)*th.beats;
      barIx++;
      if(pending!==current){ current=pending; barIx=0; }   // switch on bar boundary
    }
  }

  return {
    start(){
      if(!ensure()) return;
      if(ctx.state==='suspended') ctx.resume();
      if(!timer){ nextBarTime=ctx.currentTime+0.1; barIx=0; timer=setInterval(scheduler,25); }

    set(name){ if(THEMES[name]){ pending=name; if(!timer) current=name; } },
